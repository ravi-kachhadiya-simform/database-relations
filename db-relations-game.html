<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Database Relations: the games</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- Tokens (same palette as the rest of the session files) ---------- */
:root {
  --bg: #0f1117; --surface: #171a23; --surface-2: #1d212c; --surface-3: #262b38;
  --border: rgba(255, 255, 255, 0.08); --border-2: rgba(255, 255, 255, 0.15);
  --text: #eef0f5; --text-2: #c7ccd8; --muted: #949db0;
  --brand: #ff6b47; --on-brand: #1b0c07; --brand-soft: rgba(255, 107, 71, 0.14);
  --good: #4ade80; --bad: #ff5d73; --warn: #fbbf24;
  --c-customers: #5b9bff; --c-orders: #ff9a3c; --c-loyalty_cards: #f5cb4c; --c-products: #5fd27a; --c-order_items: #b48cff;
  --c-neutral: #9aa6bd; --c-x1: #5ce1e6; --c-x2: #ff8fc7; --c-x3: #c2b8ff;
  --team-a: #ffd166; --team-b: #6ee7f9;
  --kw: #ffffff; --str: #f9a8d4; --num: #fcd9b6; --com: #737d94; --ty: #9fb0d0; --fn: #8fd3ff;
  --shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 14px 34px -16px rgba(0, 0, 0, 0.7);
  --radius: 14px;
  --f-head: 'Space Grotesk', 'Avenir Next', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --f-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #eef1f6; --surface: #ffffff; --surface-2: #f6f7fa; --surface-3: #e7ebf2;
  --border: rgba(16, 22, 38, 0.10); --border-2: rgba(16, 22, 38, 0.20);
  --text: #121620; --text-2: #2c3446; --muted: #586174;
  --brand: #e2451f; --on-brand: #ffffff; --brand-soft: rgba(226, 69, 31, 0.10);
  --good: #12803a; --bad: #d1213d; --warn: #a95207;
  --c-customers: #2160e8; --c-orders: #cf5f06; --c-loyalty_cards: #9a6f00; --c-products: #1b8539; --c-order_items: #7444d8;
  --c-neutral: #5d6880; --c-x1: #0e7f86; --c-x2: #c0267a; --c-x3: #5b48c9;
  --team-a: #a87800; --team-b: #0a7f99;
  --kw: #0b0e15; --str: #b4135a; --num: #9a4a06; --com: #7a8295; --ty: #4f5f80; --fn: #1d5fa8;
  --shadow: 0 1px 2px rgba(16, 22, 38, 0.06), 0 10px 26px -14px rgba(16, 22, 38, 0.22);
  color-scheme: light;
}

/* ---------- Base + stage ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
body { font-family: var(--f-body); color: var(--text); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
[hidden] { display: none !important; }
#host { position: fixed; inset: 0; overflow: hidden; background: var(--bg); }
#stage {
  position: absolute; left: 50%; top: 50%; width: 1600px; height: 900px;
  transform: translate(-50%, -50%) scale(var(--s, 1)); transform-origin: center center;
  background: var(--bg); font-size: 20px; line-height: 1.4; overflow: hidden;
}
.c-customers { color: var(--c-customers); --cc: var(--c-customers); }
.c-orders { color: var(--c-orders); --cc: var(--c-orders); }
.c-loyalty_cards { color: var(--c-loyalty_cards); --cc: var(--c-loyalty_cards); }
.c-products { color: var(--c-products); --cc: var(--c-products); }
.c-order_items { color: var(--c-order_items); --cc: var(--c-order_items); }
.c-x1 { color: var(--c-x1); --cc: var(--c-x1); }
.c-x2 { color: var(--c-x2); --cc: var(--c-x2); }
.c-x3 { color: var(--c-x3); --cc: var(--c-x3); }
.t-customers { --tc: var(--c-customers); } .t-orders { --tc: var(--c-orders); } .t-loyalty_cards { --tc: var(--c-loyalty_cards); }
.t-products { --tc: var(--c-products); } .t-order_items { --tc: var(--c-order_items); }
.t-x1 { --tc: var(--c-x1); } .t-x2 { --tc: var(--c-x2); } .t-x3 { --tc: var(--c-x3); }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; border-radius: 8px; }
kbd { font: 600 14px var(--f-mono); padding: 2px 7px; border-radius: 6px; border: 1px solid var(--border-2); background: var(--surface-2); color: var(--text-2); }
code.inl { font: 600 0.88em var(--f-mono); padding: 1px 6px; border-radius: 6px; background: var(--surface-3); color: var(--text); white-space: nowrap; }

/* ---------- Buttons ---------- */
.btn {
  font: 600 18px/1.2 var(--f-body); display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 16px; border-radius: 11px; border: 1px solid var(--border-2); background: var(--surface-2); color: var(--text);
  cursor: pointer; white-space: nowrap; text-decoration: none; transition: background .18s, border-color .18s, transform .1s, opacity .18s;
}
.btn:hover { background: var(--surface-3); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--brand); color: var(--on-brand); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.small { font-size: 16px; padding: 7px 12px; border-radius: 9px; }
.btn.big { font-size: 22px; padding: 14px 26px; border-radius: 13px; }
.icon-btn {
  width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text-2); cursor: pointer; font: 700 19px var(--f-head); transition: background .18s, color .18s;
}
.icon-btn:hover { background: var(--surface-3); color: var(--text); }
.icon-btn svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* segmented control */
.seg { display: inline-flex; padding: 4px; gap: 4px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); }
.seg button {
  border: 0; background: transparent; color: var(--muted); padding: 7px 14px; border-radius: 9px; cursor: pointer;
  font: 600 16px var(--f-body); white-space: nowrap; transition: background .18s, color .18s;
}
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--surface-3); color: var(--text); box-shadow: inset 0 0 0 1px var(--border-2); }
.seg.mono button { font-family: var(--f-mono); font-size: 15px; }

/* ---------- Top bar ---------- */
.topbar {
  position: absolute; top: 0; left: 0; right: 0; height: 72px; display: flex; align-items: center; gap: 16px; padding: 0 22px;
  border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--surface) 55%, var(--bg)); z-index: 20;
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
.brand-logo { width: 42px; height: 42px; border-radius: 12px; background: var(--brand); display: grid; place-items: center; flex: none; color: var(--on-brand); box-shadow: 0 6px 18px -6px var(--brand); }
.brand-logo svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.brand-name { font: 700 23px/1.1 var(--f-head); letter-spacing: -0.01em; white-space: nowrap; }
.brand-sub { font-size: 15px; color: var(--muted); margin-top: 2px; white-space: nowrap; }
.tabs { display: flex; gap: 4px; padding: 5px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); }
.tab {
  display: flex; align-items: center; gap: 9px; font: 600 19px var(--f-head); padding: 8px 16px; border-radius: 10px; border: 0;
  background: transparent; color: var(--muted); cursor: pointer; text-decoration: none; transition: background .18s, color .18s;
}
.tab:hover { color: var(--text); }
.tab[aria-current="page"] { background: var(--surface-3); color: var(--text); }
.top-actions { display: flex; align-items: center; gap: 8px; flex: 1; justify-content: flex-end; }
.pill { font: 600 14px var(--f-body); color: var(--muted); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border); display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.pill i { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; }
.pill.live i { background: var(--good); } .pill.wait i { background: var(--warn); } .pill.off i { background: var(--bad); }

/* ---------- Code ---------- */
.code {
  margin: 0; font: 500 17px/1.55 var(--f-mono); color: var(--text-2); background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 12px 16px; white-space: pre; overflow: auto; box-shadow: var(--shadow); tab-size: 2;
}
.kw { color: var(--kw); font-weight: 700; } .str { color: var(--str); } .num { color: var(--num); }
.com { color: var(--com); font-style: italic; } .ty { color: var(--ty); } .fn { color: var(--fn); }
.tn { font-weight: 700; }
.code .ln { display: block; padding: 0 6px; margin: 0 -6px; border-radius: 6px; }
.code .ln.new { animation: lineNew 2.4s ease both; }
@keyframes lineNew { 0%, 35% { background: color-mix(in srgb, var(--good) 26%, transparent); } 100% { background: transparent; } }
.code .ln.hot { background: color-mix(in srgb, var(--brand) 16%, transparent); }

/* ---------- Table cards ---------- */
.tcard { position: relative; flex: none; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.tcard::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--tc, var(--c-neutral)); }
.tcard-head { display: flex; align-items: center; gap: 9px; padding: 11px 14px 5px; font: 700 19px var(--f-head); color: var(--tc, var(--text)); white-space: nowrap; }
.tcard-head .alias { color: var(--muted); font: 600 16px var(--f-mono); }
.tdot { width: 10px; height: 10px; border-radius: 3px; background: var(--tc, var(--c-neutral)); flex: none; }
.tcard-head .badge { margin-left: auto; font: 600 13px var(--f-body); color: var(--muted); padding-left: 10px; }
.tcard table { border-collapse: collapse; font: 500 16px var(--f-mono); width: 100%; }
.tcard th { font: 600 14px var(--f-mono); color: var(--muted); text-align: left; padding: 5px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.th-in { display: inline-flex; align-items: center; gap: 5px; }
.tcard th.pk .th-in { color: var(--tc); }
.tcard th.fk .th-in { color: var(--cc); }
.uq { font: 700 10px var(--f-body); padding: 1px 5px; border-radius: 5px; border: 1px solid currentColor; letter-spacing: .02em; }
.tcard td { padding: 0 12px; height: 34px; white-space: nowrap; color: var(--text-2); transition: background .25s, color .25s, opacity .25s; }
.tcard td.pkc { color: var(--text); font-weight: 700; }
.tcard td.fkc { font-weight: 700; color: var(--cc); }
.tcard td.null { color: var(--muted); font-style: italic; font-weight: 500; }
.tcard td.money { text-align: right; }
.tcard tbody tr + tr td { border-top: 1px solid color-mix(in srgb, var(--border) 60%, transparent); }
.tcard tr.hl td { background: color-mix(in srgb, var(--tc) 18%, transparent); }
.tcard tr.dim td { opacity: .32; }
.tcard tr.done td { opacity: .55; }
.tcard td.on { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--cc, var(--tc)) 75%, transparent); border-radius: 4px; }
.tcard tr.new td { animation: rowNew 2.2s ease both; }
@keyframes rowNew { 0%, 40% { background: color-mix(in srgb, var(--good) 28%, transparent); } 100% { background: transparent; } }
.tcard tr.changed td.chg { animation: cellChg 2.2s ease both; }
@keyframes cellChg { 0%, 40% { background: color-mix(in srgb, var(--warn) 32%, transparent); } 100% { background: transparent; } }
.tcard tr.ghost td { color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, transparent); text-decoration: line-through; text-decoration-thickness: 2px; }
.tcard tr.ghost td.bad { text-decoration: none; box-shadow: inset 0 0 0 2px var(--bad); font-weight: 800; }
.tcard tr.blocked td { background: color-mix(in srgb, var(--bad) 16%, transparent); }
.tcard tr.leaving td { color: var(--bad); text-decoration: line-through; background: color-mix(in srgb, var(--bad) 10%, transparent); }
.tcard .empty-row td { color: var(--muted); font: italic 500 15px var(--f-body); height: 40px; }
.shake { animation: shake .42s ease; }
@keyframes shake { 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(2px); } }

/* links between rows */
svg.links { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 3; }
.link { fill: none; stroke: var(--lc); stroke-width: 2.4; opacity: .7; transition: opacity .2s; }
.link-dot { fill: var(--lc); }
.link.hl { opacity: 1; stroke-width: 3.4; stroke-dasharray: 9 7; animation: flow .7s linear infinite; }
.link.bad { stroke: var(--bad); stroke-dasharray: 6 6; opacity: 1; }
.link.faint { opacity: .16; }
@keyframes flow { to { stroke-dashoffset: -16; } }
.end-label { font: 700 13px var(--f-body); fill: var(--muted); }

/* ---------- Small shared bits ---------- */
.callout { background: var(--surface); border: 1px solid var(--border-2); border-radius: 12px; padding: 12px 16px; font-size: 18px; box-shadow: var(--shadow); }
.callout.good { border-color: color-mix(in srgb, var(--good) 55%, transparent); background: color-mix(in srgb, var(--good) 8%, var(--surface)); }
.callout.bad { border-color: color-mix(in srgb, var(--bad) 55%, transparent); background: color-mix(in srgb, var(--bad) 8%, var(--surface)); }
.callout.warn { border-color: color-mix(in srgb, var(--warn) 55%, transparent); background: color-mix(in srgb, var(--warn) 8%, var(--surface)); }
.pgerr { font: 600 15px/1.45 var(--f-mono); color: var(--bad); white-space: pre-wrap; margin: 0; }
.pgerr .d { color: var(--text-2); font-weight: 500; }
.popin { animation: popIn .3s cubic-bezier(.2, 1.2, .4, 1) both; }
@keyframes popIn { from { opacity: 0; transform: translateY(8px) scale(.98); } }
.scroll { overflow: auto; scrollbar-width: thin; scrollbar-color: var(--surface-3) transparent; }
.muted { color: var(--muted); }

/* results table */
.rtable { border-collapse: collapse; font: 500 16px var(--f-mono); width: 100%; }
.rtable th { position: sticky; top: 0; text-align: left; font: 600 14px var(--f-mono); color: var(--muted); padding: 7px 12px; border-bottom: 1px solid var(--border); background: var(--surface-2); white-space: nowrap; z-index: 1; }
.rtable td { padding: 6px 12px; border-top: 1px solid color-mix(in srgb, var(--border) 60%, transparent); color: var(--text-2); white-space: nowrap; vertical-align: top; }
.rtable td.null { color: var(--muted); font-style: italic; }
.rtable td.json { white-space: pre; color: var(--text); }
.rtable tr.new td { animation: rowNew 1.6s ease both; }

/* ---------- Overlays ---------- */
.overlay-bg { position: absolute; inset: 0; z-index: 40; background: rgba(5, 7, 12, .58); display: grid; place-items: center; }
:root[data-theme="light"] .overlay-bg { background: rgba(30, 36, 50, .3); }
.sheet { background: var(--surface); border: 1px solid var(--border-2); border-radius: 18px; box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .7); padding: 22px 26px; animation: popIn .25s ease both; }
.sheet h2 { margin: 0 0 12px; font: 700 28px var(--f-head); display: flex; align-items: center; gap: 12px; }
.sheet h2 .icon-btn { margin-left: auto; }
.help dl { margin: 0; display: grid; grid-template-columns: 170px 1fr; gap: 9px 16px; align-items: center; font-size: 18px; }
.help dt { display: flex; gap: 6px; flex-wrap: wrap; }
.help dd { margin: 0; color: var(--text-2); }

.toast { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 50; padding: 12px 18px; border-radius: 12px; background: var(--surface-3); border: 1px solid var(--border-2); font-size: 18px; box-shadow: var(--shadow); animation: popIn .25s ease both; max-width: 900px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
  .link.hl { stroke-dasharray: none; }
}

/* ---------- Game shell ---------- */
.gmain { position: absolute; top: 72px; left: 0; right: 0; bottom: 0; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; }
.ghead { height: 66px; flex: none; display: flex; align-items: center; gap: 14px; padding: 0 22px; border-bottom: 1px solid var(--border); }
.ghead .gname { font: 700 22px var(--f-head); display: flex; align-items: center; gap: 10px; }
.ghead .round { font: 600 15px var(--f-body); color: var(--muted); padding: 5px 11px; border-radius: 999px; border: 1px solid var(--border-2); }
.ghead .sp { flex: 1; }
.gbody { flex: 1; min-height: 0; position: relative; padding: 18px 22px 20px; }
.board { display: flex; gap: 8px; align-items: center; }
.teampill { display: flex; align-items: center; gap: 10px; padding: 6px 8px 6px 12px; border-radius: 12px; border: 1px solid var(--border-2); background: var(--surface); font: 600 16px var(--f-body); transition: box-shadow .2s, border-color .2s; }
.teampill b { font: 700 20px var(--f-mono); min-width: 54px; text-align: right; padding: 2px 8px; border-radius: 8px; background: var(--surface-3); }
.teampill.t0 { --team: var(--team-a); } .teampill.t1 { --team: var(--team-b); }
.teampill .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--team, var(--brand)); }
.teampill.turn { border-color: var(--team); box-shadow: 0 0 0 2px color-mix(in srgb, var(--team) 40%, transparent); }
.teampill.turn::after { content: 'your turn'; font: 700 12px var(--f-body); color: var(--team); }
.plus { position: absolute; z-index: 30; font: 800 26px var(--f-head); color: var(--good); pointer-events: none; animation: plusUp 1.1s ease-out both; }
@keyframes plusUp { from { opacity: 0; transform: translateY(6px) scale(.9); } 20% { opacity: 1; } to { opacity: 0; transform: translateY(-46px) scale(1.08); } }
#confetti { position: absolute; inset: 0; pointer-events: none; z-index: 60; }

/* ---------- Home ---------- */
.home { padding: 30px 40px 26px; gap: 22px; }
.home-top { display: flex; align-items: flex-end; gap: 24px; }
.home h1 { margin: 0; font: 700 50px/1.05 var(--f-head); letter-spacing: -0.02em; }
.home .lead { margin: 8px 0 0; font-size: 20px; color: var(--text-2); max-width: 760px; }
.modepick { margin-left: auto; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
.names { display: flex; gap: 8px; }
.names input { width: 190px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border-2); background: var(--surface); font: 600 16px var(--f-body); }
.names input.t0 { box-shadow: inset 4px 0 0 var(--team-a); } .names input.t1 { box-shadow: inset 4px 0 0 var(--team-b); }
.tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; flex: 1; min-height: 0; }
.tile {
  position: relative; display: flex; flex-direction: column; gap: 10px; padding: 20px 18px 18px; border-radius: 18px; border: 1px solid var(--border);
  background: var(--surface); box-shadow: var(--shadow); text-align: left; cursor: pointer; overflow: hidden; color: var(--text); transition: transform .15s, border-color .2s;
}
.tile::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 5px; background: var(--gc); }
.tile:hover { transform: translateY(-3px); border-color: var(--gc); }
.tile .num { position: absolute; right: 16px; top: 16px; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font: 700 15px var(--f-mono); background: var(--surface-3); color: var(--muted); }
.tile .em { font-size: 54px; line-height: 1; margin-top: 6px; }
.tile .nm { font: 700 25px/1.12 var(--f-head); letter-spacing: -0.01em; }
.tile .sk { font-size: 16.5px; color: var(--text-2); line-height: 1.38; }
.tile .art { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
.tile .meta { display: flex; gap: 6px; flex-wrap: wrap; }
.tile .meta span { font: 600 13px var(--f-body); color: var(--muted); padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border-2); }
.tile .played { font: 700 14px var(--f-body); color: var(--good); }
.ta-rush { display: flex; flex-direction: column; gap: 2px; align-items: center; }
.ta-rush svg { width: 112px; height: 40px; }
.ta-rush svg .n { fill: var(--surface-3); stroke: var(--muted); stroke-width: 2; }
.ta-rush svg .l { stroke: var(--muted); stroke-width: 2.4; fill: none; }
.ta-keys { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.ta-keys .ta-tbl { font: 700 17px var(--f-head); color: var(--c-orders); padding: 10px 26px; border-radius: 10px; border: 1px solid var(--border-2); border-top: 4px solid var(--c-orders); }
.ta-keys .chip { font-size: 15px; padding: 7px 11px; transform: rotate(-4deg); }
.ta-allow { display: flex; flex-direction: column; gap: 8px; align-items: center; }

      else if (m[2]) out += `<span class="str">${esc(m[2])}</span>`;
      else if (m[3]) out += `<span class="num">${m[3]}</span>`;

    if (!j) return `${who}: ${rowsWord(kept.length)}.`;
    if (j.kind === ',' || j.on === true) return `${who}: no join condition, so it pairs with every ${NOUN[j.t][0]}. ${rowsWord(kept.length)}.`;

      if (nul) return `${who}: no ${NOUN[j.t][0]} has ${ref(mine)[1]} = ${v}. LEFT JOIN keeps the row and fills the ${NOUN[j.t][0]} columns with NULL.`;

  }

  const api = { highlight, toSQL, evaluate, frames, isGrouped, colName, val, ref, esc, LABEL, joinRows };
  window.Query = api;
})();

<script>
/* Table cards, link lines, and the JOIN step player. */
(function () {
  const { h, esc, rel } = window.UI;
  const E = window.Engine;
  const MONEY = new Set(['unit_price']);
  const KEY_SVG = '<svg class="ico" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M15 8l2 2"/></svg>';
  const LINK_SVG = '<svg class="ico" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>';

  function fmt(v, col) {
    if (v === null || v === undefined) return 'NULL';
    if (typeof v === 'number' && MONEY.has(col)) return v.toFixed(2);
    if (typeof v === 'object') return JSON.stringify(v).replace(/,"/g, ', "').replace(/":/g, '": ').replace(/},{/g, '}, {');

  }

  /* column metadata for a store table, honouring constraints switched off in db */
  function storeCols(table, names, db) {
    return names.map((name) => {
      const pk = E.PK[table].includes(name);
      const fk = E.FKS.find((f) => f.t === table && f.cols.includes(name));
      const unique = E.UNIQUES[table].some((u) => u.cols.length === 1 && u.cols[0] === name && (!db || db.isOn(u.name)));
      return { name, pk, fk: fk ? fk.ref : null, unique };
    });
  }

  function card(o) {
    const head = h('div', { class: 'tcard-head' }, h('span', { class: 'tdot' }), h('span', null, o.title),
      o.alias ? h('span', { class: 'alias' }, o.alias) : null, o.badge ? h('span', { class: 'badge', html: o.badge }) : null);
    const thead = h('tr', null, o.cols.map((c) => h('th', {
      class: [c.pk ? 'pk' : '', c.fk ? 'fk c-' + c.fk : ''].join(' ').trim() || null, 'data-col': c.name,
    }, h('span', { class: 'th-in', html: (c.pk ? KEY_SVG : '') + (c.fk ? LINK_SVG : '') + esc(c.label || c.name) + (c.unique ? ' <span class="uq">UNIQUE</span>' : '') }))));
    const body = h('tbody');

    if (!o.rows.length) body.append(h('tr', { class: 'empty-row' }, h('td', { colspan: o.cols.length }, o.empty || 'No rows')));
    const el = h('div', { class: `tcard t-${o.color || o.table}`, 'data-table': o.alias || o.table }, head,
      h('table', null, h('thead', null, thead), body));

  }
  function row(o, r) {
    return h('tr', { 'data-key': r.key, class: r.cls || null }, o.cols.map((c) => {
      const v = r.vals[c.name];
      const cls = [c.pk ? 'pkc' : '', c.fk ? 'fkc c-' + c.fk : '', v === null || v === undefined ? 'null' : '',
        MONEY.has(c.name) ? 'money' : '', (r.bad || []).includes(c.name) ? 'bad' : '', (r.chg || []).includes(c.name) ? 'chg' : ''].join(' ').trim();
      return h('td', { class: cls || null, 'data-col': c.name }, fmt(v, c.name));
    }));
  }

  /* links: [{ from: el, to: el, color, cls }] drawn as curves from one row edge to another */
  function drawLinks(svg, box, links) {
    svg.innerHTML = '';
    const NS = 'http://www.w3.org/2000/svg';
    for (const L of links) {
      if (!L.from || !L.to) continue;
      const a = rel(L.from, box), b = rel(L.to, box);

      else if (b.x + b.w <= a.x + 1) { x1 = a.x; x2 = b.x + b.w; d = -Math.max(28, (x1 - x2) / 2); }

  const Q = () => window.Query;

    constructor(parts, opts = {}) {

      if (grouped || !this.fr.grouped) rows = grouped ? this.final.rows : this.final.rows.slice(0, upto);
      else rows = this.fr.flat.slice(0, upto).map((r) => this.preview.map((c) => Q().val(r, c)));
      const n = rows.length;
      const tb = h('tbody', null, rows.map((r, i) => h('tr', { class: fresh && i >= fresh ? 'new' : null },
        r.map((v, j) => h('td', { class: [v === null ? 'null' : '', v !== null && typeof v === 'object' ? 'json' : ''].join(' ').trim() || null }, fmt(v, cols[j]))))));
      const table = h('table', { class: 'rtable' }, h('thead', null, h('tr', null, cols.map((c) => h('th', null, c)))), tb);
      this.p.res.innerHTML = '';
      const label = grouped ? `${n} ${n === 1 ? 'row' : 'rows'} after GROUP BY` : `${n} ${n === 1 ? 'row' : 'rows'} so far`;
      this.p.res.append(h('div', { class: 'jp-count' }, h('b', null, this.done ? `${n} ${n === 1 ? 'row' : 'rows'}` : label)), table);

    }
    clear() {
      for (const c of Object.values(this.cards)) {
        c.querySelectorAll('tr').forEach((tr) => tr.classList.remove('hl', 'dim', 'done', 'miss'));
        c.querySelectorAll('td.on').forEach((td) => td.classList.remove('on'));
      }
      this.svg.innerHTML = '';
      this.links = [];
    }
    apply(i) {
      this.clear();
      const st = this.fr.steps[i];
      const prevUpto = i > 0 && !this.fr.steps[i - 1].group ? this.fr.steps[i - 1].upto : 0;
      if (st.group) {
        Object.values(this.cards).forEach((c) => c.querySelectorAll('tbody tr').forEach((tr) => tr.classList.add('done')));
        this.caption(st.caption);
        this.renderResult(0, true, 0);
        this.p.res.classList.remove('squash'); void this.p.res.offsetWidth; this.p.res.classList.add('squash');
        return;
      }
      const a0 = this.aliases[0];
      const c0 = this.cards[a0];
      const steps = this.fr.steps.filter((s) => !s.group);
      const idx = steps.indexOf(st);
      c0.querySelectorAll('tbody tr').forEach((tr, k) => { if (k < idx) tr.classList.add('done'); });
      for (const a of this.aliases.slice(1)) this.cards[a].querySelectorAll('tbody tr').forEach((tr) => tr.classList.add('dim'));
      for (const [a, keys] of Object.entries(st.hl)) {
        for (const k of keys) {
          const tr = this.cards[a].querySelector(`tr[data-key="${k}"]`);
          if (tr) { tr.classList.remove('dim', 'done'); tr.classList.add('hl'); }

        const tr = c0.querySelector(`tr[data-key="${st.key}"]`);
        if (tr) tr.classList.add('miss');

      this.links = st.links.map((L) => {
        const fromTr = this.cards[L.from[0]].querySelector(`tr[data-key="${L.from[1]}"]`);
        const toTr = this.cards[L.to[0]].querySelector(`tr[data-key="${L.to[1]}"]`);
        if (fromTr && L.from[2]) { const td = fromTr.querySelector(`td[data-col="${L.from[2]}"]`); if (td) td.classList.add('on'); }
        if (toTr && L.to[2]) { const td = toTr.querySelector(`td[data-col="${L.to[2]}"]`); if (td) td.classList.add('on'); }
        const parentAlias = L.to[2] === 'id' ? L.to[0] : L.from[2] === 'id' ? L.from[0] : L.to[0];
        return { from: fromTr, to: toTr, color: `var(--c-${this.fr.tab[parentAlias]})`, cls: 'hl' };
      });

    redrawLinks() { if (this.links && this.p.stage.isConnected) drawLinks(this.svg, this.p.stage, this.links); }

    finish() {

      this.i = this.fr.steps.length - 1;

      Object.values(this.cards).forEach((c) => c.querySelectorAll('tbody tr').forEach((tr) => tr.classList.add('done')));

    play(ms) {

      const tick = () => {
        if (!this.next()) { this.stop(); if (this.opts.onEnd) this.opts.onEnd(this); return; }
        if (this.done) { this.stop(); if (this.opts.onEnd) this.opts.onEnd(this); return; }
        this.timer = setTimeout(tick, ms || this.opts.speed || 1400);
      };

      if (this.opts.onChange) this.opts.onChange(this);
    }

  }

  /* PostgreSQL for a Key Builder answer. place: { A: [chips], B: [chips], M: [chips], pkPair } with chips { key: 'a'|'b', unique } */
  function keysSQL(L, place) {
    const colType = (c) => ({ email: 'text NOT NULL UNIQUE', population: 'integer', placed_on: 'date NOT NULL DEFAULT current_date',
      unit_price: 'numeric(10,2) NOT NULL', status: "text NOT NULL DEFAULT 'processing'", card_number: 'text NOT NULL UNIQUE',
      tier: "text NOT NULL DEFAULT 'bronze'", avatar_url: 'text', bio: 'text', artist: 'text', job_title: 'text' }[c] || 'text NOT NULL');
    const ref = (k) => (k === 'a' ? L.A.name : L.B.name);
    const table = (name, cols) => {
      const w = Math.max(...cols.filter((c) => c[1] !== null).map((c) => c[0].length));
      return `CREATE TABLE ${name} (\n${cols.map(([n, d]) => (d === null ? `  ${n}` : `  ${n.padEnd(w)} ${d}`)).join(',\n')}\n);`;
    };
    const base = (T) => [['id', 'bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY'], ...T.cols.map((c) => [c, colType(c)])];
    const fkCols = (chips, selfNull) => chips.map((c) => [L.chips[c.key], `bigint${selfNull ? '' : ' NOT NULL'}${c.unique ? ' UNIQUE' : ''} REFERENCES ${L.type === 'self' ? L.A.name : ref(c.key)} (id)`]);
    const out = [];
    if (L.type === 'self') {
      out.push(table(L.A.name, [...base(L.A), ...fkCols(place.A || [], true)]));
      return out.join('\n\n');
    }
    const aT = table(L.A.name, [...base(L.A), ...fkCols(place.A || [])]);
    const bT = table(L.B.name, [...base(L.B), ...fkCols(place.B || [])]);
    const aFirst = !(place.A || []).length;
    out.push(aFirst ? aT : bT, aFirst ? bT : aT);
    if ((place.M || []).length) {
      const cols = fkCols(place.M);
      (L.jcols || []).forEach((c) => cols.push([c, c === 'quantity' ? 'integer NOT NULL DEFAULT 1' : 'integer']));
      if (place.pkPair && place.M.length === 2) cols.push([`PRIMARY KEY (${place.M.map((c) => L.chips[c.key]).join(', ')})`, null]);
      out.push(table(L.junction || 'links', cols));
    }
    return out.join('\n\n');
  }

  window.GameContent = { RUSH, KEYS, RULES, RULE_CHOICES, COUNT, BUILD, keysSQL };
})();

  function judge(L, P) {
    const has = (z, k) => P[z].find((c) => c.key === k);
    const total = P.A.length + P.B.length + P.M.length;
    if (!total) return { ok: false, msg: 'Drag a key into a table first.' };
    const a1 = SING[L.A.name], b1 = L.B ? SING[L.B.name] : '';

      left.innerHTML = '';
      left.append(h('div', { class: 'bigq' }, (R.bug ? '🐞 ' : '') + (R.ask || 'How many rows come back?')), h('pre', { class: 'code sqlcard', html: Q.highlight(Q.toSQL(R.q)) }));
      const vr = voteRows(opts, (v, val) => { if (st.phase !== 'vote') return; st.picks[v] = val; render(); }, st.picks);
      left.append(vr);
      if (st.phase === 'done') {
        markVotes(vr, opts, st.picks, answer);
        left.append(h('div', { class: 'outcome ok' }, h('div', { class: 'answer-big' }, R.value ? `${R.value.row} gets ${answer}` : `${answer} ${answer === '1' ? 'row' : 'rows'}`),
          h('div', { style: { marginTop: '6px' } }, R.why)));
      }
      const last = i + 1 >= GC.COUNT.length;
      left.append(h('div', { class: 'actions' },
        st.phase === 'vote' ? h('button', { class: 'btn big primary', disabled: !allIn(), onclick: reveal }, 'Reveal')
          : st.phase === 'playing' ? h('button', { class: 'btn big', onclick: () => player.finish() || done() }, 'Skip to the answer')
            : h('button', { class: 'btn big primary', onclick: next }, last ? 'See results' : 'Next round')));
    }
    function reveal() { st.phase = 'playing'; render(); player.play(R.q.joins[0].kind === ',' ? 420 : 640); }
    function done() {
      if (st.phase === 'done') return;
      player.stop();
      if (!player.done) player.finish();
      st.phase = 'done';
      voters().forEach((v) => { if (st.picks[v === null ? 0 : v] === answer) award(v, 100); });
      S.log.push({ i, answer, picks: st.picks.slice() });
      render();
    }
    function next() { if (i + 1 < GC.COUNT.length) countRound(i + 1, S); else countEnd(S); }
    if (!teamsOn()) opts.forEach(([val], k) => { G.keys[String(k + 1)] = () => { if (st.phase === 'vote') { st.picks[0] = val; render(); } }; });
    G.keys.Enter = () => { if (st.phase === 'vote' && allIn()) reveal(); else if (st.phase === 'done') next(); };
    render();
  }
  function countEnd(S) {
    const items = S.log.map((l) => {
      const R = GC.COUNT[l.i];
      const ok = voters().some((v) => l.picks[v === null ? 0 : v] === l.answer);
      return h('div', { class: 'it' + (ok ? ' ok' : ''), html: `<b>${l.i + 1}. ${R.value ? 'Mia gets ' + l.answer : l.answer + ' rows'}</b>: ${esc(R.why)}` });
    });
    finish(GAMES[3], S.start, [h('div', { class: 'review scroll' }, items)], () => countRound(0, { start: snapshot(), log: [] }));
  }

  /* ------------------------------------------------------------ 5. Query Builder */
  function build() {
    GAMES[4].teamNote = 'teams take turns, one puzzle each.';
    intro(GAMES[4], ['Read the goal. Each puzzle has the right pieces and a couple of traps.',
      'Click pieces to build the query from top to bottom. Click a placed piece to send it back.',
      'For CREATE TABLE puzzles, switch on the lines the table needs.',
      'First try is 300 points. Hints cost 50.'], () => buildPuzzle(0, { start: snapshot(), log: [] }));
  }
  function buildPuzzle(i, S) {
    const game = GAMES[4];
    const B = GC.BUILD[i];
    const team = teamsOn() ? i % 2 : null;
    const good = B.type === 'order' ? B.lines : B.good;
    const badMap = Object.fromEntries(B.bad);
    const pieces = shuffle([...good, ...B.bad.map((b) => b[0])]);
    const st = { placed: [], picked: new Set(), attempts: 0, hints: 0, solved: false, verdict: null, badAt: -1 };
    const s = screen();
    s.append(header(game, `Puzzle ${i + 1} of ${GC.BUILD.length}`, team));
    const body = h('div', { class: 'gbody' });
    s.append(body);
    const db = new E.DB(STORE.slice, STORE.next);
    function preview() {
      const lines = [...good, ...B.bad.map((b) => b[0])].filter((l) => st.picked.has(l));
      return `${B.head}\n${lines.map((l, k) => '  ' + l + (k < lines.length - 1 ? ',' : '')).join('\n')}\n${B.foot}`;
    }
    function render() {
      body.innerHTML = '';
      let leftEl, rightEl;
      if (B.type === 'order') {
        leftEl = h('div', { class: 'panel slots' }, h('div', { class: 'panel-h' }, 'Your query'),
          st.placed.map((l, k) => h('div', { class: 'slot' + (k === st.badAt ? ' badline' : st.solved ? ' okline' : ''), title: 'Click to send it back', html: Q.highlight(l),
            onclick: () => { if (st.solved) return; st.placed.splice(k, 1); st.badAt = -1; st.verdict = null; render(); } })),
          st.solved ? null : h('div', { class: 'slot empty' }, st.placed.length ? 'Next piece…' : 'Click a piece on the right to start'));
        rightEl = h('div', { class: 'panel pieces' }, h('div', { class: 'panel-h' }, 'Pieces'),
          pieces.filter((p) => !st.placed.includes(p)).map((p) => h('button', { class: 'piece', disabled: st.solved, html: Q.highlight(p),
            onclick: () => { st.placed.push(p); st.badAt = -1; st.verdict = null; render(); } })));
      } else {
        leftEl = h('div', { class: 'panel slots' }, h('div', { class: 'panel-h' }, 'Your CREATE TABLE'), h('pre', { class: 'code', style: { boxShadow: 'none', fontSize: '17px' }, html: Q.highlight(preview()) }));
        rightEl = h('div', { class: 'panel pieces' }, h('div', { class: 'panel-h' }, 'Switch on the lines it needs'),
          pieces.map((p) => h('button', { class: 'piece', 'aria-pressed': String(st.picked.has(p)), disabled: st.solved, html: Q.highlight(p),
            onclick: () => { if (st.picked.has(p)) st.picked.delete(p); else st.picked.add(p); st.verdict = null; render(); } })));
      }
      const v = st.verdict;
      const last = i + 1 >= GC.BUILD.length;
      const foot = h('div', { class: 'bld-foot' },
        st.solved ? h('button', { class: 'btn big primary', onclick: next }, last ? 'See results' : 'Next puzzle') : h('button', { class: 'btn big primary', onclick: check }, 'Check'),
        st.solved ? null : h('button', { class: 'btn big ghost', onclick: hint }, 'Hint (−50)'),
        st.solved || B.type !== 'order' ? null : h('button', { class: 'btn big ghost', onclick: () => { st.placed = []; st.badAt = -1; st.verdict = null; render(); } }, 'Clear'),
        h('div', { class: 'verdictbox' }, v ? h('div', { class: 'outcome ' + (v.ok ? 'ok' : 'err'), html: v.html }) : null));
      const extra = [];
      if (st.solved && B.q) {
        const r = Q.evaluate(B.q, db);
        extra.push(h('div', { class: 'panel bld-res scroll', style: { padding: '8px 10px' } }, h('div', { class: 'jp-count' }, `Postgres returns ${r.rows.length} rows`),
          h('table', { class: 'rtable' }, h('thead', null, h('tr', null, r.cols.map((c) => h('th', null, c)))),
            h('tbody', null, r.rows.map((row) => h('tr', null, row.map((x) => h('td', { class: x === null ? 'null' : null }, x === null ? 'NULL' : String(x)))))))));
      }
      body.append(h('div', { class: 'bld' }, h('div', { class: 'goal' }, '🎯 ' + B.goal), h('div', { class: 'bld-grid' }, leftEl, rightEl), ...extra, foot));
    }
    function check() {
      let msg = null;
      if (B.type === 'order') {
        const j = st.placed.findIndex((l, k) => l !== B.lines[k]);
        if (j === -1 && st.placed.length === B.lines.length) msg = null;
        else if (j === -1) { st.verdict = { ok: false, html: `So far so good. ${B.lines.length - st.placed.length} more ${B.lines.length - st.placed.length === 1 ? 'piece' : 'pieces'} to go.` }; render(); return; }
        else { st.badAt = j; msg = badMap[st.placed[j]] || `Piece ${j + 1} is in the wrong place. SQL reads SELECT, FROM, JOIN ... ON, WHERE, GROUP BY, ORDER BY.`; }
      } else {
        const badPick = [...st.picked].find((l) => badMap[l]);
        const missing = good.find((l) => !st.picked.has(l));
        if (badPick) msg = badMap[badPick];
        else if (missing) msg = (B.missing && B.missing[missing]) || 'Something is still missing.';
      }
      if (msg) { st.attempts += 1; st.verdict = { ok: false, html: '✗ ' + esc(msg) }; render(); return; }
      st.solved = true;
      const pts = Math.max(50, [300, 200, 100][Math.min(st.attempts, 2)] - st.hints * 50);
      award(team, pts);
      S.log.push({ i, pts, team });
      st.verdict = { ok: true, html: `✓ That's valid PostgreSQL and it does the job. <b>+${pts}</b>` };
      render();
    }
    function hint() {
      st.hints += 1;
      if (B.type === 'order') {
        const j = st.placed.findIndex((l, k) => l !== B.lines[k]);
        if (j !== -1) st.placed = st.placed.slice(0, j);
        else if (st.placed.length < B.lines.length) st.placed.push(B.lines[st.placed.length]);
        st.verdict = { ok: false, html: '💡 Placed the next right piece for you.' };
      } else {
        const badPick = [...st.picked].find((l) => badMap[l]);
        if (badPick) { st.picked.delete(badPick); st.verdict = { ok: false, html: '💡 Switched off a line that doesn\'t belong.' }; }
        else { const m = good.find((l) => !st.picked.has(l)); if (m) st.picked.add(m); st.verdict = { ok: false, html: '💡 Switched on a line it needs.' }; }
      }
      st.badAt = -1;
      render();
    }
    function next() { if (i + 1 < GC.BUILD.length) buildPuzzle(i + 1, S); else buildEnd(S); }
    G.keys.Enter = () => (st.solved ? next() : check());
    render();
  }
  function buildEnd(S) {
    const items = S.log.map((l) => h('div', { class: 'it ok', html: `<b>Puzzle ${l.i + 1}${l.team !== null ? ` (${esc(G.teams[l.team].name)})` : ''}: +${l.pts}.</b> ${esc(GC.BUILD[l.i].goal)}` }));
    finish(GAMES[4], S.start, [h('div', { class: 'review scroll' }, items)], () => buildPuzzle(0, { start: snapshot(), log: [] }));
  }

  /* ------------------------------------------------------------ init */
  function help() {
    sheet('Keyboard', h('div', { class: 'help' }, h('dl', null,
      [[['1', '2', '3', '4', '5'], 'On the home screen: open a game'], [['1', '2', '3'], 'Relationship Rush: sort the card'], [['Enter'], 'Start, reveal, check or next'],
        [['1', '2'], 'Solo votes in the voting games'], [['Space', 'P'], 'Playground (hold Space, press P)'], [['Space', 'G'], 'Game'], [['Space', 'S'], 'Back to the story'], [['T'], 'Light or dark'], [['F'], 'Full screen'], [['?'], 'This help'], [['Esc'], 'Close']]
        .map(([ks, d]) => [h('dt', null, ks.map((k) => h('kbd', null, k))), h('dd', null, d)]))), { width: 640 });
  }
  function init() {
    UI.init();
    $('#helpBtn').addEventListener('click', help);
    onKey('?', help);
    document.addEventListener('keydown', (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || $('#sheetBg')) return;
      const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
      if (k === 't' || k === 'f' || k === '?') return;
      const fn = G.keys[k];
      if (fn) { e.preventDefault(); fn(e); }
    });
    home();
    window.GAME = { G, GAMES, home };
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
<script>window.TABS_PAGE = 'game';</script>
<script>
/* The three pages (story, playground, game) each live in their own named tab.
   Hold Space and press P, G or S to jump between them. Tabs talk over a
   BroadcastChannel, so a page can hand another page a command (like a query
   to load) or ask it to come to the front. */
(function () {
  'use strict';
  var PAGE = window.TABS_PAGE;
  var PAGES = {
    story: { file: 'db-relations-story.html', name: 'dbrel-story', label: 'Story' },
    playground: { file: 'db-relations-playground.html', name: 'dbrel-playground', label: 'Playground' },
    game: { file: 'db-relations-game.html', name: 'dbrel-game', label: 'Game' }
  };
  var KEYS = { p: 'playground', g: 'game', s: 'story' };
  var ALIVE_MS = 90000;
  /* a fixed tab name, so window.open can find this tab again instead of opening a copy */
  try { window.name = PAGES[PAGE].name; } catch (e) { /* ignore */ }

  /* ---------- messages between tabs ---------- */
  var me = Math.random().toString(36).slice(2);
  var seq = 0;
  var seen = {};
  var handlers = [];
  var cmdHandlers = [];
  var pendingCmds = [];
  var alive = {};
  var ch = null;
  try { ch = new BroadcastChannel('dbrel-tabs'); } catch (e) { ch = null; }

  function send(msg, win) {
    seq += 1;
    var m = { id: me + ':' + seq, from: me, page: PAGE };
    for (var k in msg) m[k] = msg[k];
    if (ch) { try { ch.postMessage(m); } catch (e) { /* closed */ } }
    if (win) { try { win.postMessage({ __dbrelTabs: m }, '*'); } catch (e) { /* closed */ } }
  }
  function runCmd(cmd) {
    if (!cmdHandlers.length) { pendingCmds.push(cmd); return; }
    cmdHandlers.forEach(function (h) { try { h(cmd); } catch (e) { console.error(e); } });
  }
  function receive(m) {
    if (!m || m.from === me || seen[m.id]) return;
    seen[m.id] = 1;
    if (m.type === 'bye') delete alive[m.page];
    else if (m.page) alive[m.page] = Date.now();
    if (m.type === 'hello') send({ type: 'here' });
    if (m.to && m.to !== PAGE) return;
    if (m.type === 'focus') { try { window.focus(); } catch (e) { /* ignore */ } }
    if (m.type === 'cmd' && m.cmd) runCmd(m.cmd);
    handlers.forEach(function (h) { try { h(m); } catch (e) { console.error(e); } });
  }
  if (ch) ch.onmessage = function (e) { receive(e.data); };
  window.addEventListener('message', function (e) { if (e.data && e.data.__dbrelTabs) receive(e.data.__dbrelTabs); });
  send({ type: 'hello' });
  setInterval(function () { send({ type: 'here' }); }, 20000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) send({ type: 'here' }); });
  window.addEventListener('pagehide', function () { send({ type: 'bye' }); });

  /* a command can also arrive in the address, when this tab was just opened for it */
  (function () {
    var m = /^#cmd=(.*)$/.exec(location.hash || '');
    if (!m) return;
    try { pendingCmds.push(JSON.parse(decodeURIComponent(m[1]))); } catch (e) { /* bad link */ }
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* file urls */ }
  })();

  /* ---------- a small note in the corner ---------- */
  var noteTimer = null;
  function note(text) {
    var el = document.getElementById('tabsNote');
    if (!el) {
      el = document.createElement('div');
      el.id = 'tabsNote';
      el.setAttribute('role', 'status');
      el.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:9999;padding:10px 18px;border-radius:12px;' +
        'font:600 17px/1.3 system-ui,sans-serif;background:rgba(20,22,30,.94);color:#fff;box-shadow:0 10px 30px -10px rgba(0,0,0,.6);pointer-events:none';
      document.body.appendChild(el);
    }
    el.textContent = text;
    el.hidden = false;
    clearTimeout(noteTimer);
    noteTimer = setTimeout(function () { el.hidden = true; }, 2800);
  }

  /* ---------- open a page, or bring its tab to the front ---------- */
  function go(page, cmd) {
    var P = PAGES[page];
    if (!P) return;
    if (page === PAGE) { if (cmd) runCmd(cmd); return; }
    var w = null;
    try { w = window.open('', P.name); } catch (e) { w = null; }
    if (!w) { note('Allow pop-ups for this file, then try again.'); return; }
    var fresh = false;
    try { fresh = w.location.href === 'about:blank'; } catch (e) { fresh = false; }
    if (!fresh) {
      /* the tab is already there: bring it forward and hand it the command */
      try { w.focus(); } catch (e) { /* ignore */ }
      if (cmd) send({ type: 'cmd', to: page, cmd: cmd }, w);
      return;
    }
    var url = new URL(P.file, location.href).href + (cmd ? '#cmd=' + encodeURIComponent(JSON.stringify(cmd)) : '');
    var load = function () { try { w.location.replace(url); w.focus(); } catch (e) { /* ignore */ } };
    var last = alive[page];
    if (!last || Date.now() - last > ALIVE_MS) { load(); return; }
    /* it may be open in a tab this one can't reach by name: check before making a second copy */
    var answered = false;
    var listen = function (m) { if (m.type === 'here' && m.page === page) answered = true; };
    handlers.push(listen);
    send({ type: 'hello' });
    setTimeout(function () {
      handlers.splice(handlers.indexOf(listen), 1);
      if (!answered) { load(); return; }
      try { w.close(); } catch (e) { /* ignore */ }
      send({ type: 'focus', to: page });
      if (cmd) send({ type: 'cmd', to: page, cmd: cmd });
      note(P.label + ' is already open in another tab.');
    }, 160);
  }

  /* ---------- Space + P / G / S ---------- */
  var TEXT_INPUT = /^(text|search|email|url|tel|password|number|date|datetime-local|month|time|week)$/i;
  function typing(t) {
    if (!t || !t.closest) return false;
    if (t.closest('textarea, select, [contenteditable=""], [contenteditable="true"]')) return true;
    return t.tagName === 'INPUT' && TEXT_INPUT.test(t.type || 'text');
  }
  var shortcut = function (page) { go(page); };
  var held = false;
  var used = false;
  var heldTarget = null;
  var heldShift = false;
  var replaying = false;
  window.addEventListener('keydown', function (e) {
    if (replaying || e.ctrlKey || e.metaKey || e.altKey || typing(e.target)) return;
    if (e.key === ' ' || e.code === 'Space') {
      /* Space waits for its key-up: alone it does its usual job, with P, G or S it switches tabs */
      e.preventDefault();
      e.stopImmediatePropagation();
      if (e.repeat || held) return;
      held = true; used = false; heldTarget = e.target; heldShift = e.shiftKey;
      return;
    }
    if (!held) return;
    var page = KEYS[(e.key || '').toLowerCase()];
    if (!page) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    used = true;
    if (page === PAGE) { note("You're on the " + PAGES[page].label + '.'); return; }
    shortcut(page);
  }, true);
  window.addEventListener('keyup', function (e) {
    if (e.key !== ' ' && e.code !== 'Space') return;
    if (!held) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    held = false;
    if (!used) replay(heldTarget, heldShift);
  }, true);
  window.addEventListener('blur', function () { held = false; });
  /* hand the plain Space press back to the page, exactly as it would have arrived */
  function replay(t, shift) {
    var target = t && t.isConnected ? t : document.body;
    var ev = new KeyboardEvent('keydown', { key: ' ', code: 'Space', shiftKey: shift, bubbles: true, cancelable: true });
    var open;
    replaying = true;
    try { open = target.dispatchEvent(ev); } finally { replaying = false; }
    if (open && target.matches && target.matches('button, [role="button"], summary, input[type="checkbox"], input[type="radio"]') && !target.disabled) target.click();
  }

  /* links between the pages (the tabs in the header) */
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[data-page]');
    if (!a || e.ctrlKey || e.metaKey || e.shiftKey || e.button) return;
    e.preventDefault();
    if (a.dataset.page !== PAGE) shortcut(a.dataset.page);
  });

  window.Tabs = {
    page: PAGE,
    go: go,
    send: send,
    note: note,
    on: function (h) { handlers.push(h); },
    onCommand: function (h) {
      cmdHandlers.push(h);
      var list = pendingCmds.splice(0);
      if (list.length) setTimeout(function () { list.forEach(runCmd); }, 0);
    },
    setShortcut: function (fn) { shortcut = fn; }
  };
})();

</script>
<script>
(function () {
  function start() {
    Tabs.on(function (m) { if (m.type === 'theme' && m.t && m.t !== document.documentElement.dataset.theme) UI.setTheme(m.t); });
    Tabs.onCommand(function (c) {
      if (c.type !== 'open') return;
      if (typeof c.teams === 'boolean') GAME.G.mode = c.teams ? 'teams' : 'solo';
      GAME.G.rushTimer = !!c.timer;
      var g = GAME.GAMES.filter(function (x) { return x.id === c.game; })[0];
      if (g) g.run(); else GAME.home();
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>
</body>
