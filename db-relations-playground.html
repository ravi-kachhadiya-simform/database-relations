<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Database Relations: PostgreSQL playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- Tokens (same palette as the rest of the session files) ---------- */
:root {
  --bg: #0f1117; --surface: #171a23; --surface-2: #1d212c; --surface-3: #262b38;
  --border: rgba(255, 255, 255, 0.08); --border-2: rgba(255, 255, 255, 0.15);
  --text: #eef0f5; --text-2: #c7ccd8; --muted: #949db0;
  --brand: #ff6b47; --on-brand: #1b0c07; --brand-soft: rgba(255, 107, 71, 0.14);
  --good: #4ade80; --bad: #ff5d73; --warn: #fbbf24;
  --c-customers: #5b9bff; --c-orders: #ff9a3c; --c-loyalty_cards: #f5cb4c; --c-products: #5fd27a; --c-order_items: #b48cff;
  --c-neutral: #9aa6bd; --c-x1: #5ce1e6; --c-x2: #ff8fc7; --c-x3: #c2b8ff;
  --team-a: #ffd166; --team-b: #6ee7f9;
  --kw: #ffffff; --str: #f9a8d4; --num: #fcd9b6; --com: #737d94; --ty: #9fb0d0; --fn: #8fd3ff;
  --shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 14px 34px -16px rgba(0, 0, 0, 0.7);
  --radius: 14px;
  --f-head: 'Space Grotesk', 'Avenir Next', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --f-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #eef1f6; --surface: #ffffff; --surface-2: #f6f7fa; --surface-3: #e7ebf2;
  --border: rgba(16, 22, 38, 0.10); --border-2: rgba(16, 22, 38, 0.20);
  --text: #121620; --text-2: #2c3446; --muted: #586174;
  --brand: #e2451f; --on-brand: #ffffff; --brand-soft: rgba(226, 69, 31, 0.10);
  --good: #12803a; --bad: #d1213d; --warn: #a95207;
  --c-customers: #2160e8; --c-orders: #cf5f06; --c-loyalty_cards: #9a6f00; --c-products: #1b8539; --c-order_items: #7444d8;
  --c-neutral: #5d6880; --c-x1: #0e7f86; --c-x2: #c0267a; --c-x3: #5b48c9;
  --team-a: #a87800; --team-b: #0a7f99;
  --kw: #0b0e15; --str: #b4135a; --num: #9a4a06; --com: #7a8295; --ty: #4f5f80; --fn: #1d5fa8;
  --shadow: 0 1px 2px rgba(16, 22, 38, 0.06), 0 10px 26px -14px rgba(16, 22, 38, 0.22);
  color-scheme: light;
}

/* ---------- Base + stage ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
body { font-family: var(--f-body); color: var(--text); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
[hidden] { display: none !important; }
#host { position: fixed; inset: 0; overflow: hidden; background: var(--bg); }
#stage {
  position: absolute; left: 50%; top: 50%; width: 1600px; height: 900px;
  transform: translate(-50%, -50%) scale(var(--s, 1)); transform-origin: center center;
  background: var(--bg); font-size: 20px; line-height: 1.4; overflow: hidden;
}
.c-customers { color: var(--c-customers); --cc: var(--c-customers); }
.c-orders { color: var(--c-orders); --cc: var(--c-orders); }
.c-loyalty_cards { color: var(--c-loyalty_cards); --cc: var(--c-loyalty_cards); }
.c-products { color: var(--c-products); --cc: var(--c-products); }
.c-order_items { color: var(--c-order_items); --cc: var(--c-order_items); }
.c-x1 { color: var(--c-x1); --cc: var(--c-x1); }
.c-x2 { color: var(--c-x2); --cc: var(--c-x2); }
.c-x3 { color: var(--c-x3); --cc: var(--c-x3); }
.t-customers { --tc: var(--c-customers); } .t-orders { --tc: var(--c-orders); } .t-loyalty_cards { --tc: var(--c-loyalty_cards); }
.t-products { --tc: var(--c-products); } .t-order_items { --tc: var(--c-order_items); }
.t-x1 { --tc: var(--c-x1); } .t-x2 { --tc: var(--c-x2); } .t-x3 { --tc: var(--c-x3); }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; border-radius: 8px; }
kbd { font: 600 14px var(--f-mono); padding: 2px 7px; border-radius: 6px; border: 1px solid var(--border-2); background: var(--surface-2); color: var(--text-2); }
code.inl { font: 600 0.88em var(--f-mono); padding: 1px 6px; border-radius: 6px; background: var(--surface-3); color: var(--text); white-space: nowrap; }

/* ---------- Buttons ---------- */
.btn {
  font: 600 18px/1.2 var(--f-body); display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 16px; border-radius: 11px; border: 1px solid var(--border-2); background: var(--surface-2); color: var(--text);
  cursor: pointer; white-space: nowrap; text-decoration: none; transition: background .18s, border-color .18s, transform .1s, opacity .18s;
}
.btn:hover { background: var(--surface-3); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--brand); color: var(--on-brand); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.small { font-size: 16px; padding: 7px 12px; border-radius: 9px; }
.btn.big { font-size: 22px; padding: 14px 26px; border-radius: 13px; }
.icon-btn {
  width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text-2); cursor: pointer; font: 700 19px var(--f-head); transition: background .18s, color .18s;
}
.icon-btn:hover { background: var(--surface-3); color: var(--text); }
.icon-btn svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* segmented control */
.seg { display: inline-flex; padding: 4px; gap: 4px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); }
.seg button {
  border: 0; background: transparent; color: var(--muted); padding: 7px 14px; border-radius: 9px; cursor: pointer;
  font: 600 16px var(--f-body); white-space: nowrap; transition: background .18s, color .18s;
}
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--surface-3); color: var(--text); box-shadow: inset 0 0 0 1px var(--border-2); }
.seg.mono button { font-family: var(--f-mono); font-size: 15px; }

/* ---------- Top bar ---------- */
.topbar {
  position: absolute; top: 0; left: 0; right: 0; height: 72px; display: flex; align-items: center; gap: 16px; padding: 0 22px;
  border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--surface) 55%, var(--bg)); z-index: 20;
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
.brand-logo { width: 42px; height: 42px; border-radius: 12px; background: var(--brand); display: grid; place-items: center; flex: none; color: var(--on-brand); box-shadow: 0 6px 18px -6px var(--brand); }
.brand-logo svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.brand-name { font: 700 23px/1.1 var(--f-head); letter-spacing: -0.01em; white-space: nowrap; }
.brand-sub { font-size: 15px; color: var(--muted); margin-top: 2px; white-space: nowrap; }
.tabs { display: flex; gap: 4px; padding: 5px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); }
.tab {
  display: flex; align-items: center; gap: 9px; font: 600 19px var(--f-head); padding: 8px 16px; border-radius: 10px; border: 0;
  background: transparent; color: var(--muted); cursor: pointer; text-decoration: none; transition: background .18s, color .18s;
}
.tab:hover { color: var(--text); }
.tab[aria-current="page"] { background: var(--surface-3); color: var(--text); }
.top-actions { display: flex; align-items: center; gap: 8px; flex: 1; justify-content: flex-end; }
.pill { font: 600 14px var(--f-body); color: var(--muted); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border); display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.pill i { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; }
.pill.live i { background: var(--good); } .pill.wait i { background: var(--warn); } .pill.off i { background: var(--bad); }

/* ---------- Code ---------- */
.code {
  margin: 0; font: 500 17px/1.55 var(--f-mono); color: var(--text-2); background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 12px 16px; white-space: pre; overflow: auto; box-shadow: var(--shadow); tab-size: 2;
}
.kw { color: var(--kw); font-weight: 700; } .str { color: var(--str); } .num { color: var(--num); }
.com { color: var(--com); font-style: italic; } .ty { color: var(--ty); } .fn { color: var(--fn); }
.tn { font-weight: 700; }
.code .ln { display: block; padding: 0 6px; margin: 0 -6px; border-radius: 6px; }
.code .ln.new { animation: lineNew 2.4s ease both; }
@keyframes lineNew { 0%, 35% { background: color-mix(in srgb, var(--good) 26%, transparent); } 100% { background: transparent; } }
.code .ln.hot { background: color-mix(in srgb, var(--brand) 16%, transparent); }

/* ---------- Table cards ---------- */
.tcard { position: relative; flex: none; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.tcard::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--tc, var(--c-neutral)); }
.tcard-head { display: flex; align-items: center; gap: 9px; padding: 11px 14px 5px; font: 700 19px var(--f-head); color: var(--tc, var(--text)); white-space: nowrap; }
.tcard-head .alias { color: var(--muted); font: 600 16px var(--f-mono); }
.tdot { width: 10px; height: 10px; border-radius: 3px; background: var(--tc, var(--c-neutral)); flex: none; }
.tcard-head .badge { margin-left: auto; font: 600 13px var(--f-body); color: var(--muted); padding-left: 10px; }
.tcard table { border-collapse: collapse; font: 500 16px var(--f-mono); width: 100%; }
.tcard th { font: 600 14px var(--f-mono); color: var(--muted); text-align: left; padding: 5px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.th-in { display: inline-flex; align-items: center; gap: 5px; }
.tcard th.pk .th-in { color: var(--tc); }
.tcard th.fk .th-in { color: var(--cc); }
.uq { font: 700 10px var(--f-body); padding: 1px 5px; border-radius: 5px; border: 1px solid currentColor; letter-spacing: .02em; }
.tcard td { padding: 0 12px; height: 34px; white-space: nowrap; color: var(--text-2); transition: background .25s, color .25s, opacity .25s; }
.tcard td.pkc { color: var(--text); font-weight: 700; }
.tcard td.fkc { font-weight: 700; color: var(--cc); }
.tcard td.null { color: var(--muted); font-style: italic; font-weight: 500; }
.tcard td.money { text-align: right; }
.tcard tbody tr + tr td { border-top: 1px solid color-mix(in srgb, var(--border) 60%, transparent); }
.tcard tr.hl td { background: color-mix(in srgb, var(--tc) 18%, transparent); }
.tcard tr.dim td { opacity: .32; }
.tcard tr.done td { opacity: .55; }
.tcard td.on { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--cc, var(--tc)) 75%, transparent); border-radius: 4px; }
.tcard tr.new td { animation: rowNew 2.2s ease both; }
@keyframes rowNew { 0%, 40% { background: color-mix(in srgb, var(--good) 28%, transparent); } 100% { background: transparent; } }
.tcard tr.changed td.chg { animation: cellChg 2.2s ease both; }
@keyframes cellChg { 0%, 40% { background: color-mix(in srgb, var(--warn) 32%, transparent); } 100% { background: transparent; } }
.tcard tr.ghost td { color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, transparent); text-decoration: line-through; text-decoration-thickness: 2px; }
.tcard tr.ghost td.bad { text-decoration: none; box-shadow: inset 0 0 0 2px var(--bad); font-weight: 800; }
.tcard tr.blocked td { background: color-mix(in srgb, var(--bad) 16%, transparent); }
.tcard tr.leaving td { color: var(--bad); text-decoration: line-through; background: color-mix(in srgb, var(--bad) 10%, transparent); }
.tcard .empty-row td { color: var(--muted); font: italic 500 15px var(--f-body); height: 40px; }
.shake { animation: shake .42s ease; }
@keyframes shake { 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(2px); } }

/* links between rows */
svg.links { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 3; }
.link { fill: none; stroke: var(--lc); stroke-width: 2.4; opacity: .7; transition: opacity .2s; }
.link-dot { fill: var(--lc); }
.link.hl { opacity: 1; stroke-width: 3.4; stroke-dasharray: 9 7; animation: flow .7s linear infinite; }
.link.bad { stroke: var(--bad); stroke-dasharray: 6 6; opacity: 1; }
.link.faint { opacity: .16; }
@keyframes flow { to { stroke-dashoffset: -16; } }
.end-label { font: 700 13px var(--f-body); fill: var(--muted); }

/* ---------- Small shared bits ---------- */
.callout { background: var(--surface); border: 1px solid var(--border-2); border-radius: 12px; padding: 12px 16px; font-size: 18px; box-shadow: var(--shadow); }
.callout.good { border-color: color-mix(in srgb, var(--good) 55%, transparent); background: color-mix(in srgb, var(--good) 8%, var(--surface)); }
.callout.bad { border-color: color-mix(in srgb, var(--bad) 55%, transparent); background: color-mix(in srgb, var(--bad) 8%, var(--surface)); }
.callout.warn { border-color: color-mix(in srgb, var(--warn) 55%, transparent); background: color-mix(in srgb, var(--warn) 8%, var(--surface)); }
.pgerr { font: 600 15px/1.45 var(--f-mono); color: var(--bad); white-space: pre-wrap; margin: 0; }
.pgerr .d { color: var(--text-2); font-weight: 500; }
.popin { animation: popIn .3s cubic-bezier(.2, 1.2, .4, 1) both; }
@keyframes popIn { from { opacity: 0; transform: translateY(8px) scale(.98); } }
.scroll { overflow: auto; scrollbar-width: thin; scrollbar-color: var(--surface-3) transparent; }
.muted { color: var(--muted); }

/* results table */
.rtable { border-collapse: collapse; font: 500 16px var(--f-mono); width: 100%; }
.rtable th { position: sticky; top: 0; text-align: left; font: 600 14px var(--f-mono); color: var(--muted); padding: 7px 12px; border-bottom: 1px solid var(--border); background: var(--surface-2); white-space: nowrap; z-index: 1; }
.rtable td { padding: 6px 12px; border-top: 1px solid color-mix(in srgb, var(--border) 60%, transparent); color: var(--text-2); white-space: nowrap; vertical-align: top; }
.rtable td.null { color: var(--muted); font-style: italic; }
.rtable td.json { white-space: pre; color: var(--text); }
.rtable tr.new td { animation: rowNew 1.6s ease both; }

/* ---------- Overlays ---------- */
.overlay-bg { position: absolute; inset: 0; z-index: 40; background: rgba(5, 7, 12, .58); display: grid; place-items: center; }
:root[data-theme="light"] .overlay-bg { background: rgba(30, 36, 50, .3); }
.sheet { background: var(--surface); border: 1px solid var(--border-2); border-radius: 18px; box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .7); padding: 22px 26px; animation: popIn .25s ease both; }
.sheet h2 { margin: 0 0 12px; font: 700 28px var(--f-head); display: flex; align-items: center; gap: 12px; }
.sheet h2 .icon-btn { margin-left: auto; }
.help dl { margin: 0; display: grid; grid-template-columns: 170px 1fr; gap: 9px 16px; align-items: center; font-size: 18px; }
.help dt { display: flex; gap: 6px; flex-wrap: wrap; }
.help dd { margin: 0; color: var(--text-2); }

.toast { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 50; padding: 12px 18px; border-radius: 12px; background: var(--surface-3); border: 1px solid var(--border-2); font-size: 18px; box-shadow: var(--shadow); animation: popIn .25s ease both; max-width: 900px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
  .link.hl { stroke-dasharray: none; }
}

/* ---------- Mode bar ---------- */
.modebar { position: absolute; top: 72px; left: 0; right: 0; height: 64px; display: flex; align-items: center; gap: 18px; padding: 0 20px; border-bottom: 1px solid var(--border); }
.modes { display: flex; gap: 6px; }
.mode-btn {
  display: flex; align-items: center; gap: 8px; padding: 9px 13px 9px 10px; border-radius: 12px; border: 1px solid transparent;
  background: transparent; color: var(--muted); cursor: pointer; font: 600 18px var(--f-head); transition: background .18s, color .18s, border-color .18s;
}
.mode-btn .n { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font: 700 14px var(--f-mono); background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); }
.mode-btn:hover { color: var(--text); }
.mode-btn[aria-pressed="true"] { color: var(--text); background: var(--surface); border-color: var(--border-2); box-shadow: var(--shadow); }
.mode-btn[aria-pressed="true"] .n { background: var(--brand); color: var(--on-brand); border-color: transparent; }
.mode-sub { color: var(--muted); font-size: 17px; margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.main { position: absolute; top: 136px; left: 0; right: 0; bottom: 0; }
.mode { position: absolute; inset: 0; padding: 16px 20px 18px; display: none; }
.mode.on { display: grid; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); min-height: 0; min-width: 0; }
.panel-h { font: 700 15px var(--f-body); color: var(--muted); margin: 0 0 8px; }
.lbl { font: 600 14px var(--f-body); color: var(--muted); }

/* ---------- Design ---------- */
#mode-design { grid-template-columns: 492px 1fr; gap: 16px; }
.dz-left { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.pairs { display: flex; flex-wrap: wrap; gap: 7px; }
.pairbtn { border: 1px solid var(--border); background: var(--surface); color: var(--text-2); border-radius: 10px; padding: 6px 10px; font: 600 14.5px var(--f-body); cursor: pointer; transition: background .18s, border-color .18s, color .18s; }
.pairbtn:hover { color: var(--text); border-color: var(--border-2); }
.pairbtn[aria-pressed="true"] { background: var(--brand-soft); border-color: var(--brand); color: var(--text); }
.own { display: flex; align-items: center; gap: 8px; font-size: 16px; color: var(--text-2); }
.own input { width: 130px; padding: 7px 10px; border-radius: 9px; border: 1px solid var(--border-2); background: var(--surface-2); font: 600 16px var(--f-body); }
.qbox { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.qrow { display: flex; align-items: center; gap: 12px; }
.qrow .qt { flex: 1; font: 600 18.5px/1.28 var(--f-head); }
.qrow .qn { width: 28px; height: 28px; flex: none; border-radius: 50%; display: grid; place-items: center; font: 700 14px var(--f-mono); background: var(--surface-3); color: var(--muted); }
.yn button { min-width: 62px; }
.yn button[aria-pressed="true"].yes { background: color-mix(in srgb, var(--good) 22%, var(--surface-3)); }
.yn button[aria-pressed="true"].no { background: color-mix(in srgb, var(--bad) 18%, var(--surface-3)); }
.verdict { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; flex: none; }
.verdict .v-title { font: 700 27px/1.1 var(--f-head); letter-spacing: -0.01em; }
.verdict .v-line { font-size: 16px; color: var(--text-2); }
.verdict .v-fk { font: 600 15px var(--f-mono); color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px; padding: 6px 10px; }
.verdict .v-people { font-size: 16px; color: var(--muted); }
.check { font-size: 15px; padding: 6px 10px; border-radius: 9px; }
.check.ok { background: color-mix(in srgb, var(--good) 13%, transparent); color: var(--text); }
.check.no { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--text); }
.truth { width: 100%; border-collapse: collapse; font-size: 15px; }
.truth th { text-align: left; color: var(--muted); font: 600 13px var(--f-body); padding: 4px 8px; }
.truth td { padding: 4px 8px; border-top: 1px solid var(--border); color: var(--text-2); }
.truth tr.on td { background: var(--brand-soft); color: var(--text); font-weight: 600; }
.truth tr.on td:first-child { box-shadow: inset 3px 0 0 var(--brand); }
.dz-right { display: grid; grid-template-rows: 1fr 300px; gap: 14px; min-height: 0; }
.diagram { position: relative; display: flex; align-items: center; justify-content: center; gap: 150px; padding: 18px; overflow: hidden; }
.diagram.three { gap: 72px; }
.diagram.three .tcard table { font-size: 15.5px; }
.diagram.three .tcard th { font-size: 13.5px; }
.diagram.three .tcard td { height: 33px; padding: 0 10px; }
.diagram.three .tcard-head { font-size: 19px; }
.diagram .tcard table { font-size: 18px; }

<script>
/* SQL highlighting + a small SELECT model that prints PostgreSQL, runs on the

(function () {

    'VALUES UPDATE SET DELETE CREATE TABLE PRIMARY KEY REFERENCES UNIQUE CHECK DEFAULT GENERATED ALWAYS IDENTITY INDEX ALTER ' +
    'ADD DROP CONSTRAINT RETURNING OVERRIDING SYSTEM VALUE CASCADE RESTRICT NO ACTION BEGIN COMMIT ROLLBACK HAVING LIMIT OFFSET ' +

      else if (m[2]) out += `<span class="str">${esc(m[2])}</span>`;
      else if (m[3]) out += `<span class="num">${m[3]}</span>`;

    orders: (r) => `Order ${r.id}`,
    products: (r) => r.name,
    loyalty_cards: (r) => `Card ${r.id}`,
    order_items: (r) => `Line ${r.order_id}/${r.product_id}`,
  };
  const NOUN = { customers: ['customer', 'customers'], orders: ['order', 'orders'], products: ['product', 'products'],
    loyalty_cards: ['card', 'cards'], order_items: ['line', 'lines'] };
  const plural = (n, t) => `${n} ${NOUN[t][n === 1 ? 0 : 1]}`;
  const rowsWord = (n) => (n === 1 ? '1 row' : `${n} rows`);
  function keyOf(t, r) { return window.Engine.keyOf(t, r); }

  function frames(q, db) {
    const t0 = q.from[0], a0 = q.from[1];
    const tab = { [a0]: t0 };
    q.joins.forEach((j) => { tab[j.a] = j.t; });
    const steps = [];
    const flat = [];
    for (const r of pkSort(t0, db.rows(t0))) {
      let combos = [{ [a0]: r }];
      const hl = { [a0]: new Set([keyOf(t0, r)]) };
      const links = [];
      const notes = [];
      for (const j of q.joins) {
        const right = pkSort(j.t, db.rows(j.t));
        const next = [];
        const onPair = j.on === true || j.kind === ',' ? null : j.on[0];
        const otherRef = onPair ? (ref(onPair[0])[0] === j.a ? onPair[1] : onPair[0]) : null;
        const myRef = onPair ? (ref(onPair[0])[0] === j.a ? onPair[0] : onPair[1]) : null;
        for (const cmb of combos) {
          const ms = right.filter((R) => onOk(j, { ...cmb, [j.a]: R }));
          if (ms.length) {
            for (const m of ms) {
              next.push({ ...cmb, [j.a]: m });
              (hl[j.a] = hl[j.a] || new Set()).add(keyOf(j.t, m));
              const fromAlias = otherRef ? ref(otherRef)[0] : a0;
              links.push({ from: [fromAlias, keyOf(tab[fromAlias], cmb[fromAlias]), otherRef ? ref(otherRef)[1] : null],
                           to: [j.a, keyOf(j.t, m), myRef ? ref(myRef)[1] : null] });
            }
          } else if (j.kind === 'LEFT JOIN') {
            next.push({ ...cmb, [j.a]: null });
            notes.push({ kind: 'null', j, cmb, otherRef });
          } else notes.push({ kind: 'drop', j, cmb, otherRef });
        }
        combos = next;
      }
      const kept = combos.filter((c) => whereOk(q, c));
      flat.push(...kept);
      steps.push({ alias: a0, key: keyOf(t0, r), row: r, hl: Object.fromEntries(Object.entries(hl).map(([k, v]) => [k, [...v]])),
        links, notes, made: kept.length, filtered: combos.length - kept.length, upto: flat.length,
        caption: (q.caption || caption)(q, r, combos, kept, notes, tab) });
    }
    const grouped = isGrouped(q);
    if (grouped) {
      steps.push({ group: true, caption: q.groupCaption || 'GROUP BY squashes the rows that share a group into one row.' });
    }
    return { steps, flat, grouped, tab };
  }

  function caption(q, r, combos, kept, notes, tab) {
    const t0 = q.from[0];
    const who = `<b>${esc(LABEL[t0](r))}</b>`;
    const j = q.joins[0];
    if (q.where && combos.length && !kept.length) return `${who}: WHERE ${q.where.map(([c, v]) => `${c} = ${v}`).join(' AND ')} throws these rows away.`;
    if (!j) return `${who}: ${rowsWord(kept.length)}.`;
    if (j.kind === ',' || j.on === true) return `${who}: no join condition, so it pairs with every ${NOUN[j.t][0]}. ${rowsWord(kept.length)}.`;
    const drop = notes.find((n) => n.kind === 'drop');
    const nul = notes.find((n) => n.kind === 'null');
    if (q.joins.length === 1) {
      const [x, y] = j.on[0];
      const mine = ref(x)[0] === j.a ? x : y, theirs = mine === x ? y : x;
      const v = val({ [q.from[1]]: r }, theirs);
      if (v === null && (drop || nul)) {
        return `${who}: ${theirs} is NULL. NULL never matches anything, so ${nul ? 'LEFT JOIN keeps the row and fills the right side with NULL' : 'JOIN drops the row'}.`;
      }
      if (drop) return `${who}: no ${NOUN[j.t][0]} has ${ref(mine)[1]} = ${v}. JOIN drops the row.`;
      if (nul) return `${who}: no ${NOUN[j.t][0]} has ${ref(mine)[1]} = ${v}. LEFT JOIN keeps the row and fills the ${NOUN[j.t][0]} columns with NULL.`;
      const n = kept.length;
      if (tab[ref(mine)[0]] === t0 && ref(mine)[1] === 'id') {
        const m = combos[0][j.a];
        return `${who}: ${theirs.split('.')[1]} is ${v}, so it finds <b>${esc(LABEL[j.t](m))}</b>. ${rowsWord(n)}.`;
      }
      if (ref(mine)[1] === 'id') {
        const m = combos[0][j.a];
        return `${who}: ${ref(theirs)[1]} is ${v}, so it finds <b>${esc(LABEL[j.t](m))}</b>. ${rowsWord(n)}.`;
      }
      return `${who}: ${plural(n, j.t)} with ${ref(mine)[1]} = ${v}, so ${rowsWord(n)}.`;
    }
    if (drop) return `${who}: nothing to follow, so JOIN drops it.`;
    const lines = new Set(combos.map((c) => keyOf(q.joins[0].t, c[q.joins[0].a])));
    return `${who}: ${plural(lines.size, q.joins[0].t)} in ${q.joins[0].t}. Each one follows its key to ${q.joins[1].t}. ${rowsWord(kept.length)}.`;
  }

  const api = { highlight, toSQL, evaluate, frames, isGrouped, colName, val, ref, esc, LABEL, joinRows };
  window.Query = api;
})();

</script>

/* ------------------------------------------------------------ Design tables: pairs and SQL generators */
(function () {
  const E = (one, many, table, col, colDef, rows, color, label) => ({ one, many, table, col, colDef, rows, color, label: label || col });
  const PAIRS = [
    { id: 'co', label: 'Customer & Order', store: true, truth: [true, false],

      b: E('order', 'orders', 'orders', 'status', "text NOT NULL DEFAULT 'processing'", [[1001, 'delivered'], [1002, 'delivered'], [1003, 'delivered'], [1026, 'delivered']], 'orders', 'id') },
    { id: 'cl', label: 'Customer & Loyalty card', store: true, truth: [false, false],
      a: E('customer', 'customers', 'customers', 'first_name', 'text NOT NULL', [[1, 'Emma'], [2, 'John'], [4, 'James']], 'customers'),
      b: E('loyalty card', 'loyalty cards', 'loyalty_cards', 'card_number', 'text NOT NULL UNIQUE', [[1, '7700 0001 2648'], [2, '7700 0002 5296'], [4, '7700 0004 2673']], 'loyalty_cards') },
    { id: 'op', label: 'Order & Product', store: true, truth: [true, true], junction: 'order_items', jcol: ['quantity', 'integer NOT NULL DEFAULT 1', 1],
      a: E('order', 'orders', 'orders', 'placed_on', 'date NOT NULL DEFAULT current_date', [[1001, '2025-11-05'], [1002, '2025-11-07'], [1026, '2026-01-19']], 'orders', 'id'),
      b: E('product', 'products', 'products', 'name', 'text NOT NULL', [[1, 'Mechanical Keyboard 75%'], [2, 'Wireless Mouse'], [6, 'Felt Desk Mat']], 'products') },
    { id: 'cc', label: 'Country & City', truth: [true, false],
      a: E('country', 'countries', 'countries', 'name', 'text NOT NULL', [[1, 'United States'], [2, 'United Kingdom'], [3, 'Canada']], 'x1'),
      b: E('city', 'cities', 'cities', 'name', 'text NOT NULL', [[1, 'Austin'], [2, 'London'], [3, 'Toronto'], [4, 'Chicago']], 'x2') },
    { id: 'up', label: 'User & Profile', truth: [false, false],
      a: E('user', 'users', 'users', 'email', 'text NOT NULL UNIQUE', [[1, 'emma@example.com'], [2, 'john@example.com'], [3, 'olivia@example.com']], 'x1'),
      b: E('profile', 'profiles', 'profiles', 'bio', 'text', [[1, 'Keyboard nerd'], [2, 'Night owl'], [3, 'Coffee first']], 'x2') },
    { id: 'sc', label: 'Student & Course', truth: [true, true], junction: 'enrollments', jcol: ['enrolled_on', 'date NOT NULL DEFAULT current_date', '2026-09-01'],
      a: E('student', 'students', 'students', 'name', 'text NOT NULL', [[1, 'Emma'], [2, 'John'], [3, 'Olivia']], 'x1'),
      b: E('course', 'courses', 'courses', 'title', 'text NOT NULL', [[1, 'Algebra'], [2, 'Biology'], [3, 'Chemistry']], 'x2') },
    { id: 'em', label: 'Manager & Employee', self: true, truth: [true, false],
      a: E('manager', 'managers', 'employees', 'name', 'text NOT NULL', [[1, 'Grace'], [2, 'Oliver'], [3, 'Sophie'], [4, 'Henry']], 'x3'),
      b: E('employee', 'employees', 'employees', 'name', 'text NOT NULL', [[1, 'Grace'], [2, 'Oliver'], [3, 'Sophie'], [4, 'Henry']], 'x3') },
    { id: 'own', label: 'Your own pair', custom: true },
  ];

  const snake = (s) => s.trim().toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '') || 'thing';
  function pluralize(w) {
    const s = w.trim().toLowerCase();
    if (!s) return s;
    if (/(s|x|z|ch|sh)$/.test(s)) return s + 'es';
    if (/[^aeiou]y$/.test(s)) return s.slice(0, -1) + 'ies';
    return s + 's';
  }
  function customPair(aw, bw) {
    const A = aw.trim().toLowerCase() || 'team', B = bw.trim().toLowerCase() || 'player';
    const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
    const rows = (w) => [1, 2, 3].map((i) => [i, `${cap(w)} ${i}`]);
    const bt = snake(pluralize(B)), at = snake(pluralize(A));
    const same = at === bt;
    return { id: 'own', label: 'Your own pair', custom: true, self: same,
      a: E(A, pluralize(A), at, 'name', 'text NOT NULL', rows(A), 'x1'),
      b: E(B, pluralize(B), bt, 'name', 'text NOT NULL', same ? rows(A) : rows(B), same ? 'x1' : 'x2') };
  }

  function selfNames(P) {
    if (P.id === 'em') return { fk1: 'manager_id', fkN1: 'report_id', junction: 'employee_managers', jA: 'employee_id', jB: 'manager_id', a1: 'e', a2: 'm', l1: 'employee', l2: 'manager', l2N1: 'leads' };
    const one = snake(P.a.one);
    return { fk1: 'parent_id', fkN1: 'child_id', junction: `${one}_links`, jA: `${one}_id`, jB: 'linked_id', a1: 'x', a2: 'y', l1: one, l2: 'parent', l2N1: 'child' };
  }

  function kindOf(q1, q2) {
    if (q1 === null || q2 === null || q1 === undefined || q2 === undefined) return null;
    if (q1 && !q2) return '1N';
    if (!q1 && q2) return 'N1';
    if (!q1 && !q2) return '11';
    return 'MN';
  }

  function aliasFor(table, taken) {
    const parts = table.split('_');
    let a = parts.length > 1 ? parts.map((p) => p[0]).join('') : table[0];
    if (taken.includes(a)) a = table.slice(0, 2);
    if (taken.includes(a)) a = table.slice(0, 3);
    return a;
  }

  /* the model: which tables, which columns, where the key sits, sample rows */
  function model(P, kind) {
    const A = P.a, B = P.b;
    const fkA = snake(A.one) + '_id', fkB = snake(B.one) + '_id';
    const tables = [];
    const cols = (T) => [{ name: 'id', pk: true, def: 'bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY' }, { name: T.col, def: T.colDef }];
    if (P.self) {
      const N = selfNames(P);
      const T = { ...A, cols: cols(A), rows: A.rows.map(([id, v]) => ({ id, [A.col]: v })) };
      if (kind === 'MN') {
        const J = { table: N.junction, color: 'x2', cols: [
          { name: N.jA, fk: T.table, pkPart: true, def: `bigint NOT NULL REFERENCES ${T.table} (id)` },
          { name: N.jB, fk: T.table, pkPart: true, def: `bigint NOT NULL REFERENCES ${T.table} (id)` }] };
        J.rows = [[1, 0], [2, 0], [2, 1], [3, 1]].filter(([i, j]) => T.rows[i] && T.rows[j])
          .map(([i, j]) => ({ [N.jA]: T.rows[i].id, [N.jB]: T.rows[j].id }));
        return { kind, self: true, parentFirst: [T, J], child: J, links: [[N.jA, T], [N.jB, T]], fk: null, junction: J };
      }
      const fk = kind === 'N1' ? N.fkN1 : N.fk1;
      const vals = kind === '11' ? [null, 1, 2, 3] : [null, 1, 1, 2];
      T.cols.push({ name: fk, fk: T.table, unique: kind === '11', def: `bigint${kind === '11' ? ' UNIQUE' : ''} REFERENCES ${T.table} (id)` });
      T.rows.forEach((r, i) => { r[fk] = vals[i]; });
      return { kind, self: true, parentFirst: [T], child: T, parent: T, fk, links: [[fk, T]] };
    }
    const TA = { ...A, cols: cols(A), rows: A.rows.map(([id, v]) => ({ id, [A.col]: v })) };
    const TB = { ...B, cols: cols(B), rows: B.rows.map(([id, v]) => ({ id, [B.col]: v })) };
    if (kind === 'MN') {
      const jn = P.junction || `${snake(A.one)}_${B.table}`;
      const J = { table: jn, color: P.junction === 'order_items' ? 'order_items' : 'x3', cols: [
        { name: fkA, fk: A.table, pkPart: true, def: `bigint NOT NULL REFERENCES ${A.table} (id)` },
        { name: fkB, fk: B.table, pkPart: true, def: `bigint NOT NULL REFERENCES ${B.table} (id)` }] };
      if (P.jcol) J.cols.push({ name: P.jcol[0], def: P.jcol[1] });
      J.rows = [[0, 0], [0, 2], [1, 1], [2, 1]].map(([i, j]) => {
        const r = { [fkA]: TA.rows[i].id, [fkB]: TB.rows[j].id };
        if (P.jcol) r[P.jcol[0]] = P.jcol[2];
        return r;
      });
      return { kind, parentFirst: [TA, TB, J], child: J, links: [[fkA, TA], [fkB, TB]], junction: J, A: TA, B: TB, fkA, fkB };
    }
    if (kind === 'N1') {
      TA.cols.push({ name: fkB, fk: B.table, def: `bigint NOT NULL REFERENCES ${B.table} (id)` });
      TA.rows.forEach((r, i) => { r[fkB] = TB.rows[[0, 1, 0][i % 3]].id; });
      return { kind, parentFirst: [TB, TA], child: TA, parent: TB, fk: fkB, links: [[fkB, TB]], A: TA, B: TB };
    }
    const uniq = kind === '11';
    TB.cols.push({ name: fkA, fk: A.table, unique: uniq, def: `bigint NOT NULL${uniq ? ' UNIQUE' : ''} REFERENCES ${A.table} (id)` });
    if (uniq) TB.rows = TB.rows.slice(0, 2);
    TB.rows.forEach((r, i) => { r[fkA] = TA.rows[uniq ? i : [0, 1, 2, 0][i % 4]].id; });
    return { kind, parentFirst: [TA, TB], child: TB, parent: TA, fk: fkA, links: [[fkA, TA]], A: TA, B: TB };
  }

  function tableSQL(T, extra) {
    const w = Math.max(...T.cols.map((c) => c.name.length));
    const lines = T.cols.map((c) => `  ${c.name.padEnd(w)} ${c.def}`);
    if (T.cols.some((c) => c.pkPart)) lines.push(`  PRIMARY KEY (${T.cols.filter((c) => c.pkPart).map((c) => c.name).join(', ')})`);
    return `CREATE TABLE ${T.table} (\n${lines.join(',\n')}\n);` + (extra ? '\n' + extra : '');
  }

  function ddl(P, kind) {
    if (!kind) {
      return [P.a, ...(P.self ? [] : [P.b])].map((T) => tableSQL({ table: T.table, cols: [
        { name: 'id', def: 'bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY' }, { name: T.col, def: T.colDef }] })).join('\n\n') +
        '\n\n-- Answer the two questions to add the link.';
    }
    const M = model(P, kind);
    const out = [];
    for (const T of M.parentFirst) out.push(tableSQL(T));
    if (M.junction) {
      const second = M.junction.cols[1].name;
      out.push(`-- Postgres indexes the primary key (${M.junction.cols[0].name} first),\n-- but not the second foreign key on its own.\nCREATE INDEX ON ${M.junction.table} (${second});`);
    } else if (kind === '11') {
      out.push(`-- UNIQUE also gives ${M.fk} an index, so no extra one needed.`);
    } else {
      out.push(`-- Postgres doesn't index foreign keys for you.\nCREATE INDEX ON ${M.child.table} (${M.fk});`);
    }
    return out.join('\n\n');
  }

  function joinSQL(P, kind) {
    if (!kind) return '-- Answer the two questions to see the JOIN.';
    const M = model(P, kind);
    const A = P.a, B = P.b;
    const lab = (T) => (T.label === 'id' ? 'id' : T.col);
    if (P.self) {
      const t = A.table, N = selfNames(P);
      if (kind === 'MN') {
        return `SELECT ${N.a1}.name AS ${N.l1}, ${N.a2}.name AS ${N.l2}\nFROM ${t} ${N.a1}\nJOIN ${N.junction} j ON j.${N.jA} = ${N.a1}.id\nJOIN ${t} ${N.a2} ON ${N.a2}.id = j.${N.jB}\nORDER BY ${N.a1}.id, ${N.a2}.id;`;
      }
      const fk = kind === 'N1' ? N.fkN1 : N.fk1, lab = kind === 'N1' ? N.l2N1 : N.l2;
      return `SELECT ${N.a1}.name AS ${N.l1}, ${N.a2}.name AS ${lab}\nFROM ${t} ${N.a1}\nLEFT JOIN ${t} ${N.a2} ON ${N.a2}.id = ${N.a1}.${fk}\nORDER BY ${N.a1}.id;`;
    }
    const aa = aliasFor(A.table, []), bb = aliasFor(B.table, [aa]);
    const same = lab(A) === lab(B);
    const colA = `${aa}.${lab(A)}${same || lab(A) === 'id' ? ` AS ${snake(A.one)}${lab(A) === 'id' ? '_id' : ''}` : ''}`;
    const colB = `${bb}.${lab(B)}${same || lab(B) === 'id' ? ` AS ${snake(B.one)}${lab(B) === 'id' ? '_id' : ''}` : ''}`;
    if (kind === 'MN') {
      const jj = aliasFor(M.junction.table, [aa, bb]);
      return `SELECT ${colA}, ${colB}\nFROM ${A.table} ${aa}\nJOIN ${M.junction.table} ${jj} ON ${jj}.${M.fkA} = ${aa}.id\nJOIN ${B.table} ${bb} ON ${bb}.id = ${jj}.${M.fkB}\nORDER BY ${aa}.id, ${bb}.id;`;
    }
    if (kind === 'N1') return `SELECT ${colA}, ${colB}\nFROM ${A.table} ${aa}\nJOIN ${B.table} ${bb} ON ${bb}.id = ${aa}.${M.fk}\nORDER BY ${aa}.id;`;
    const j = kind === '11' ? 'LEFT JOIN' : 'JOIN';
    return `SELECT ${colA}, ${colB}\nFROM ${A.table} ${aa}\n${j} ${B.table} ${bb} ON ${bb}.${M.fk} = ${aa}.id\nORDER BY ${aa}.id${kind === '11' ? '' : `, ${bb}.id`};`;
  }

  window.PGContent.design = { PAIRS, customPair, kindOf, model, ddl, joinSQL, pluralize, snake, selfNames };
})();

<script>
/* Interview prep: real questions on keys, relationships, JOINs and PostgreSQL.
   [[x]] marks inline code. run: true means the SQL runs in the Write SQL tab. */
(function () {
  const TOPICS = [
    ['all', 'All', '✨'], ['keys', 'Keys', '🔑'], ['o2m', 'One-to-many', '🧺'], ['o2o', 'One-to-one', '🪪'], ['m2m', 'Many-to-many', '🛒'],
    ['joins', 'JOINs', '🔗'], ['rules', 'ON DELETE and rules', '🛡️'], ['pg', 'PostgreSQL specifics', '🐘'], ['design', 'Schema design', '📐'], ['write', 'Write the query', '⌨️'],
  ];
  const ORDER_ITEMS = `CREATE TABLE order_items (
  order_id   bigint  NOT NULL REFERENCES orders (id),
  product_id bigint  NOT NULL REFERENCES products (id),
  quantity   integer NOT NULL CHECK (quantity > 0),
  unit_price numeric(10,2) NOT NULL,
  PRIMARY KEY (order_id, product_id)
);`;
  const Q = [
    /* ---------------------------------------------------------------- keys */
    { id: 'pk', topic: 'keys', level: 'junior', hot: true, q: 'What is a primary key?',
      say: 'The column, or set of columns, that uniquely identifies each row. It can never be NULL, it never repeats, and a table has at most one.',
      more: ['Postgres enforces it with a unique index it creates for you.',
        'In our store, [[customers.id]] is the primary key. There are two John Smiths in the full store, and they are told apart by their ids: 2 and 61.',
        'Other tables point at it with foreign keys, so it should never change.'],
      sql: `CREATE TABLE customers (
  id    bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
  email text   NOT NULL UNIQUE
);`,
      follow: [['Can a primary key have more than one column?', 'Yes, that is a composite key, like [[PRIMARY KEY (order_id, product_id)]] in order_items.'],
        ['Can a table have no primary key?', 'Postgres allows it, but then nothing reliably points at one row. Almost every table should have one.']],
      avoid: 'Saying "it is the id column". The name does not matter. Unique, not null, and stable are what matter.' },
    { id: 'fk', topic: 'keys', level: 'junior', hot: true, q: 'What is a foreign key?',
      say: 'A column that points at the primary key of another table. Postgres checks that every value really exists there, so you can\'t have an order for a customer that doesn\'t exist.',
      more: ['[[orders.customer_id REFERENCES customers (id)]] is a foreign key.',
        'It also protects deletes: you can\'t delete a customer while orders still point at them, unless you choose ON DELETE CASCADE or SET NULL.',
        'This guarantee is called referential integrity: no orphan rows.'],
      sql: `-- There is no customer 999, so Postgres refuses this
INSERT INTO orders (customer_id)
VALUES (999);`, run: true, expect: 'error',
      follow: [['Can a foreign key point at a column that is not the primary key?', 'Yes, at any column with a UNIQUE or PRIMARY KEY constraint, like customers.email. Most teams point at the id because it never changes.'],
        ['How would you find orphan rows in a database that has no foreign keys?', 'LEFT JOIN to the parent and keep rows where the parent is missing: [[LEFT JOIN customers c ON c.id = o.customer_id WHERE c.id IS NULL]].']],
      avoid: 'Saying it just "links two tables". The point is that Postgres enforces it on insert, update and delete.' },
    { id: 'pk-unique', topic: 'keys', level: 'junior', hot: true, q: 'Primary key vs UNIQUE constraint: what is the difference?',
      say: 'Both stop duplicates. A primary key is also NOT NULL, there is only one per table, and it is the row\'s identity. A table can have many UNIQUE constraints, and they allow NULLs.',
      more: ['In our store, [[customers.id]] is the primary key and [[email]] is UNIQUE: no two customers can share an email, but other tables still point at the id.',
        'Postgres treats NULLs as distinct in a UNIQUE column, so many rows can have NULL. Since PostgreSQL 15 you can write [[UNIQUE NULLS NOT DISTINCT]] to allow only one.',
        'Both create an index automatically.'],
      follow: [['Can a table have two primary keys?', 'No. One primary key, which may span several columns, plus as many UNIQUE constraints as you like.']],
      avoid: 'Saying they are the same thing.' },
    { id: 'natural', topic: 'keys', level: 'mid', q: 'Natural key or surrogate key: which do you use?',
      say: 'A natural key is real data, like an email. A surrogate key is a value the database makes up, like an id. I use a surrogate as the primary key and keep the natural key UNIQUE.',
      more: ['Natural keys change. People change emails, products change codes, and every foreign key pointing at them would have to change too.',
        'A surrogate never changes and is small, so joins and indexes stay fast.',
        'Keeping [[email text NOT NULL UNIQUE]] still stops duplicate accounts.'],
      follow: [['When is a natural key fine?', 'When it truly never changes and is short, like an ISO country code (US, GB) in a small lookup table.']],
      avoid: 'Making email or name the primary key of customers.' },
    { id: 'composite', topic: 'keys', level: 'mid', q: 'What is a composite key, and when do you use one?',
      say: 'A primary key made of two or more columns. The classic case is a junction table: [[PRIMARY KEY (order_id, product_id)]] means each product appears once per order.',
      more: ['Each column on its own can repeat. Order 1001 has two lines, and the Wireless Mouse is in three orders. Only the pair must be unique.',
        'The index Postgres builds on (order_id, product_id) is great for lookups by order_id, but not much help for product_id alone, so we add an index on product_id too.'],
      sql: ORDER_ITEMS,
      follow: [['What happens if you insert the same pair twice?', 'Postgres rejects it: duplicate key value violates unique constraint "order_items_pkey". To buy two, update the quantity.']] },
    { id: 'fk-null', topic: 'keys', level: 'junior', q: 'Can a foreign key be NULL? What does that mean?',
      say: 'Yes, unless the column is NOT NULL. NULL means the row points at nothing, which is how you model an optional link.',
      more: ['[[customers.referred_by]] is nullable. Emma signed up on her own, so hers is NULL. Olivia was invited by Emma, so hers is 1.',
        '[[orders.customer_id]] is NOT NULL, because every order must have a customer.',
        'Postgres only checks the foreign key when the value is not NULL.'],
      sql: `SELECT id, first_name, referred_by
FROM customers
ORDER BY id;`, run: true },
    { id: 'gaps', topic: 'keys', level: 'junior', q: 'Why are there gaps in my ids?',
      say: 'Sequences never go back. A failed insert, a rolled back transaction or a deleted row all leave a gap. That is by design, so inserts never wait for each other.',
      more: ['Never use ids as a count, or as invoice numbers that must have no gaps. Use [[count(*)]] for counts.',
        'Try it in the Change data tab: "Leave the email empty" fails, but it still uses up an id.'],
      sql: `INSERT INTO orders (customer_id) VALUES (999);  -- fails, but uses up id 1121
INSERT INTO orders (customer_id) VALUES (1) RETURNING id;  -- gets 1122
-- run the two lines one at a time to see it`,
      follow: [['Can you make the ids gapless?', 'Not with a sequence. If the law needs gapless numbers, keep a separate counter table and update it inside the same transaction, and accept that inserts queue up.']] },

    /* ---------------------------------------------------------------- one-to-many */
    { id: 'o2m', topic: 'o2m', level: 'junior', hot: true, q: 'How do you model a one-to-many relationship?',
      say: 'Put the foreign key on the "many" side. One customer has many orders, so orders gets [[customer_id]] that points at [[customers.id]].',
      more: ['The "one" side doesn\'t change at all. customers has no idea how many orders exist.',
        'Each order holds exactly one customer_id, and the same value repeats: Emma\'s id is on three orders.',
        'Add an index on the foreign key. Postgres doesn\'t create one for you.'],
      sql: `CREATE TABLE orders (
  id          bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
  customer_id bigint NOT NULL REFERENCES customers (id)
);
CREATE INDEX ON orders (customer_id);`,
      follow: [['Why not put an order_ids column on customers?', 'A column holds one value. Emma has three orders and might have fifty next year. The key goes where each row has exactly one parent.']],
      avoid: 'Putting the foreign key on the "one" side.' },
    { id: 'o2m-m2o', topic: 'o2m', level: 'junior', hot: true, q: 'What is the difference between one-to-many and many-to-one?',
      say: 'Nothing in the database. It is the same relationship read from the other end: one customer has many orders, and many orders belong to one customer.',
      more: ['The tables are identical either way: [[orders.customer_id]] points at [[customers.id]].',
        'ORMs often name both sides: a customer "has many" orders, an order "belongs to" a customer. Same foreign key.'],
      follow: [['So how do you know which side is "many"?', 'Ask both questions. Can one customer have many orders? Yes. Can one order have many customers? No. The side that can repeat gets the foreign key.']] },
    { id: 'spot', topic: 'o2m', level: 'junior', hot: true, q: 'You are shown two tables. How do you tell which relationship they have?',
      say: 'Look at the foreign key. A plain foreign key is one-to-many. A foreign key with UNIQUE is one-to-one. A table in the middle with two foreign keys is many-to-many.',
      more: ['Without a schema, ask the two questions: can one A have many Bs, and can one B have many As? Yes and no is one-to-many, no and no is one-to-one, yes and yes is many-to-many.',
        'A table pointing at itself, like [[employees.manager_id]], is a self-reference, usually one-to-many.'],
      sql: `-- Every key in this database
SELECT conrelid::regclass AS table_name,
       pg_get_constraintdef(oid) AS definition
FROM pg_constraint
WHERE contype IN ('p', 'f', 'u')
  AND connamespace = 'public'::regnamespace
ORDER BY 1, 2;`, run: true },
    { id: 'list', topic: 'o2m', level: 'mid', hot: true, q: 'Why not store a list of ids in one column?',
      say: 'Because the database can\'t protect it or search it well. A foreign key can\'t check ids inside a list, and searching it is slow and buggy. One row per item fixes both.',
      more: ['On our full store, searching a text list with [[LIKE \'%2%\']] for the Wireless Mouse matches 38 orders. Only 4 really have it. The 2 inside 12, 20 and 25 matched too.',
        'You also have nowhere to store quantity or price per item, and deleting a product leaves stale ids behind.',
        'One value per column is first normal form.'],
      follow: [['Postgres has arrays. Why not bigint[]?', 'Arrays fix the search bug with [[2 = ANY(product_ids)]], but a foreign key still can\'t check the items and there is no place for quantity. Arrays are fine for simple labels you never join on.']] },

    /* ---------------------------------------------------------------- one-to-one */
    { id: 'o2o', topic: 'o2o', level: 'junior', hot: true, q: 'How do you enforce a one-to-one relationship?',
      say: 'A foreign key plus UNIQUE. [[loyalty_cards.customer_id]] references customers and is UNIQUE, so a customer can have at most one card.',
      more: ['Take UNIQUE away and it quietly becomes one-to-many.',
        'Another way: make the foreign key the primary key too, like [[profiles.user_id bigint PRIMARY KEY REFERENCES users (id)]].'],
      sql: `CREATE TABLE loyalty_cards (
  id          bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
  customer_id bigint NOT NULL UNIQUE REFERENCES customers (id),
  card_number text   NOT NULL UNIQUE
);`,
      follow: [['What error do you get for a second card?', 'duplicate key value violates unique constraint "loyalty_cards_customer_id_key", with DETAIL: Key (customer_id)=(1) already exists.']] },
    { id: 'o2o-why', topic: 'o2o', level: 'mid', q: 'Why split data into a one-to-one table instead of adding columns?',
      say: 'When the extra data is optional, large, or owned by a different part of the app. Not every customer has a loyalty card, so the card lives in its own table instead of empty columns on customers.',
      more: ['It keeps the main table small and quick to scan.',
        'You can lock it down separately, for example only the billing service reads payment details.',
        'If every row always has the data and you always read it together, one table is simpler.'],
      follow: [['Which table gets the foreign key?', 'The dependent, usually optional, side. A card can\'t exist without a customer, so loyalty_cards holds customer_id. Put it on customers instead and every customer without a card carries a NULL.']] },
    { id: 'shared-pk', topic: 'o2o', level: 'senior', q: 'What is a shared primary key?',
      say: 'The child uses the parent\'s id as its own primary key and as the foreign key. That forces one-to-one without a separate UNIQUE.',
      more: ['A profile can\'t exist without its user, and a user can\'t have two profiles, because [[profiles.user_id]] is the primary key.',
        'It saves a column and an index. The trade-off: the profile can never move to another user.'],
      sql: `CREATE TABLE profiles (
  user_id bigint PRIMARY KEY REFERENCES users (id) ON DELETE CASCADE,
  bio     text
);` },

    /* ---------------------------------------------------------------- many-to-many */
    { id: 'm2m', topic: 'm2m', level: 'junior', hot: true, q: 'How do you model a many-to-many relationship?',
      say: 'With a junction table that holds two foreign keys, one for each side. order_items has [[order_id]] and [[product_id]], one row per pair.',
      more: ['Neither main table can hold the key: an order has many products, and a product is in many orders.',
        'Make the pair the primary key so the same pair can\'t be added twice.',
        'A many-to-many is really two one-to-many links meeting in the middle.'],
      sql: ORDER_ITEMS,
      follow: [['What is that middle table called?', 'Junction table, join table, bridge table, link table or associative table. Same thing.']] },
    { id: 'm2m-cols', topic: 'm2m', level: 'mid', q: 'Can a junction table have its own columns?',
      say: 'Yes, and it often should. Facts about the pair live there: quantity and the price paid in order_items, the enrolment date in enrollments, the role in project_members.',
      more: ['Those facts don\'t belong to the order alone or the product alone. They belong to "this product in this order".',
        'Once a junction table has its own facts, it usually earns a real name: order_items, enrollments, bookings.'] },
    { id: 'price', topic: 'm2m', level: 'mid', hot: true, q: 'Why does order_items store unit_price when products already has a price?',
      say: 'Because an order must remember the price at the time of purchase. Product prices change. Old orders must not.',
      more: ['Emma bought the keyboard in November 2025 for 99.00. It costs 89.00 today. order_items keeps 99.00, products shows 89.00.',
        'That is not a normalization mistake. It is a different fact: the price paid, not the current price.'],
      sql: `SELECT oi.order_id, p.name,
       oi.unit_price AS paid,
       p.unit_price  AS price_today
FROM order_items oi
JOIN products p ON p.id = oi.product_id
WHERE oi.order_id = 1001;`, run: true },
    { id: 'junction-id', topic: 'm2m', level: 'senior', q: 'Composite primary key or a surrogate id on a junction table?',
      say: 'Both work. The composite key is simplest and blocks duplicates by itself. If I add an id column, I still add [[UNIQUE (order_id, product_id)]], or duplicates sneak in.',
      more: ['Some ORMs and APIs want a single id per row. That is the usual reason to add one.',
        'Either way, index the second foreign key for lookups from the other side.'],
      sql: `CREATE TABLE order_items (
  id         bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
  order_id   bigint NOT NULL REFERENCES orders (id),
  product_id bigint NOT NULL REFERENCES products (id),
  UNIQUE (order_id, product_id)
);` },

    /* ---------------------------------------------------------------- self reference */
    { id: 'self', topic: 'o2m', level: 'mid', hot: true, q: 'How do you model employees and their managers?',
      say: 'One employees table with [[manager_id]] pointing back at [[employees.id]]. The person at the top has NULL.',
      more: ['It is a normal one-to-many, inside one table. Our store does the same with [[customers.referred_by]].',
        'To read it, join the table to itself with two aliases.'],
      sql: `SELECT c.first_name AS customer,
       r.first_name AS invited_by
FROM customers c
LEFT JOIN customers r ON r.id = c.referred_by
ORDER BY c.id;`, run: true,
      follow: [['How do you get the whole chain, up to the top?', 'A recursive CTE: WITH RECURSIVE follows the links level by level.']] },
    { id: 'recursive', topic: 'pg', level: 'senior', q: 'How do you fetch a whole hierarchy, like everyone below a manager?',
      say: 'A recursive CTE. Start from one row, then keep joining the children of the rows you found until nothing new comes back.',
      more: ['The first SELECT is the starting point. The second runs again and again, each time finding the next level.',
        'On the full store, this lists Emma, the people she invited, the people they invited, and so on.'],
      sql: `WITH RECURSIVE invited AS (
  SELECT id, first_name, referred_by, 1 AS depth
  FROM customers
  WHERE id = 1                 -- start at Emma
  UNION ALL
  SELECT c.id, c.first_name, c.referred_by, i.depth + 1
  FROM customers c
  JOIN invited i ON c.referred_by = i.id
)
SELECT * FROM invited
ORDER BY depth, id;`, run: true, data: 'full' },

    /* ---------------------------------------------------------------- joins */
    { id: 'inner-left', topic: 'joins', level: 'junior', hot: true, q: 'What is the difference between INNER JOIN and LEFT JOIN?',
      say: 'INNER JOIN keeps only rows that match on both sides. LEFT JOIN keeps every row from the left table and fills the right side with NULL when nothing matches.',
      more: ['[[customers JOIN orders]] drops Mia, who has no orders. [[customers LEFT JOIN orders]] keeps her with NULLs.',
        'Use LEFT JOIN when "has none" is an answer you want to see.'],
      sql: `SELECT c.first_name, o.id AS order_id
FROM customers c
LEFT JOIN orders o ON o.customer_id = c.id
ORDER BY c.id, o.id;`, run: true,
      follow: [['What about RIGHT JOIN and FULL JOIN?', 'RIGHT JOIN is a LEFT JOIN with the tables swapped, so most people stick to LEFT. FULL JOIN keeps unmatched rows from both sides.']] },
    { id: 'fanout', topic: 'joins', level: 'mid', hot: true, q: 'Why does my JOIN return more rows than the table has?',
      say: 'Because the join follows a one-to-many link, so each parent repeats once per child. Emma has three orders, so she shows up three times.',
      more: ['It gets worse when you join two different "many" tables at once: the rows multiply, and SUMs come out too big.',
        'Fix it by grouping, by using EXISTS when you only need yes or no, or by aggregating each child table in a subquery before joining.'],
      sql: `SELECT c.first_name, count(*) AS rows_after_join
FROM customers c
JOIN orders o ON o.customer_id = c.id
GROUP BY c.id
ORDER BY c.id;`, run: true },
    { id: 'count-star', topic: 'joins', level: 'mid', hot: true, q: 'After a LEFT JOIN, should you use count(*) or count(o.id)?',
      say: 'count(o.id). LEFT JOIN gives a customer with no orders one row full of NULLs. count(*) counts that row, so they get 1. count(o.id) skips NULLs, so they get 0.',
      more: ['Run it and look at Mia: count_star is 1, count_id is 0.'],
      sql: `SELECT c.first_name,
       count(*)    AS count_star,
       count(o.id) AS count_id
FROM customers c
LEFT JOIN orders o ON o.customer_id = c.id
GROUP BY c.id
ORDER BY c.id;`, run: true },
    { id: 'where-on', topic: 'joins', level: 'senior', hot: true, q: 'In a LEFT JOIN, what changes if a condition goes in ON instead of WHERE?',
      say: 'A condition on the right table in WHERE throws away the NULL rows, so the LEFT JOIN quietly becomes an INNER JOIN. Filters on the right table belong in ON.',
      more: ['With [[WHERE o.status = \'delivered\']], Mia disappears: her o.status is NULL, and NULL = \'delivered\' is not true.',
        'Filters on the left table go in WHERE as usual.'],
      sql: `-- Customers with their delivered orders, keeping customers with none
SELECT c.first_name, o.id AS order_id
FROM customers c
LEFT JOIN orders o
  ON o.customer_id = c.id
 AND o.status = 'delivered'
ORDER BY c.id, o.id;`, run: true },
    { id: 'self-join', topic: 'joins', level: 'junior', q: 'What is a self join? Give an example.',
      say: 'Joining a table to itself, with two aliases. [[customers c LEFT JOIN customers r ON r.id = c.referred_by]] shows who invited whom.',
      more: ['The aliases are what tell Postgres which copy you mean.',
        'Another common use: finding duplicates by comparing each row with the others.'],
      sql: `-- Customers who share a full name with someone else
SELECT a.id, b.id AS same_name_id, a.first_name, a.last_name
FROM customers a
JOIN customers b
  ON b.first_name = a.first_name
 AND b.last_name = a.last_name
 AND b.id > a.id;`, run: true, data: 'full' },
    { id: 'cartesian', topic: 'joins', level: 'mid', q: 'What is a Cartesian product, and how do you get one by accident?',
      say: 'Every row paired with every row. 5 customers and 6 orders give 30 rows. You get one by forgetting the join condition.',
      more: ['A wrong condition like [[ON o.id = c.id]] is the opposite bug: it compares ids from different tables and returns nothing, or nonsense.',
        'A CROSS JOIN on purpose is fine, like pairing every size with every color.'],
      sql: `-- No join condition: 5 x 6 = 30 rows
SELECT c.first_name, o.id
FROM customers c, orders o;`, run: true },
    { id: 'n-plus-1', topic: 'joins', level: 'mid', hot: true, q: 'What is the N+1 query problem?',
      say: 'Loading a list with one query, then running one more query per item to load its children. 100 customers means 101 queries. Fix it with one JOIN, or one batched query for all the children.',
      more: ['It hides in API handlers and ORM loops, like calling getOrders(customer.id) inside a map.',
        'The batched version sends all the ids at once with [[= ANY(...)]].',
        'Or let Postgres build the nested JSON in one query with json_agg.'],
      sql: `-- One query for every customer's orders, instead of one per customer
SELECT customer_id, id AS order_id, status
FROM orders
WHERE customer_id = ANY('{1, 2, 3, 4, 5}'::bigint[])
ORDER BY customer_id, id;`, run: true },
    { id: 'json', topic: 'pg', level: 'senior', q: 'How do you return nested JSON for an API straight from PostgreSQL?',
      say: '[[json_build_object]] builds each object and [[json_agg]] rolls the child rows into an array, grouped by the parent. With a LEFT JOIN, add FILTER and COALESCE so parents with no children get an empty array.',
      more: ['Without the FILTER, Mia would get [{"id": null, "status": null}] instead of [].',
        'One-to-one comes out as an object or null, one-to-many as an array: exactly what a React component expects.'],
      sql: `SELECT c.id, c.first_name,
       COALESCE(json_agg(json_build_object('id', o.id, 'status', o.status)
                ORDER BY o.id) FILTER (WHERE o.id IS NOT NULL),
                '[]') AS orders
FROM customers c
LEFT JOIN orders o ON o.customer_id = c.id
GROUP BY c.id
ORDER BY c.id;`, run: true },

    /* ---------------------------------------------------------------- rules */
    { id: 'on-delete', topic: 'rules', level: 'mid', hot: true, q: 'What happens when you delete a row that other rows point at?',
      say: 'By default Postgres blocks the delete. You choose per foreign key: CASCADE deletes the children too, SET NULL clears the link, and RESTRICT always blocks.',
      more: ['In our store: deleting Emma is blocked, because her orders point at her. Deleting Mia works, and her loyalty card goes with her (CASCADE). Deleting John, once his orders are gone, sets James\'s referred_by to NULL (SET NULL).',
        'Choose per link: an order line can\'t live without its order, but a customer with orders should not vanish.'],
      sql: `-- Blocked: Emma still has orders
DELETE FROM customers
WHERE id = 1;`, run: true, expect: 'error' },
    { id: 'cascade', topic: 'rules', level: 'mid', q: 'When is ON DELETE CASCADE dangerous?',
      say: 'When it can wipe out data you need. One DELETE can follow cascades through several tables. I use it for true parts of a parent, like order lines, never for records like orders or payments.',
      more: ['For important records, soft delete instead: add [[deleted_at timestamptz]] and filter it out, or archive the rows.',
        'Before a risky delete, run it inside BEGIN and ROLLBACK to see what it would remove.'],
      sql: `BEGIN;
DELETE FROM orders WHERE id = 1001;
SELECT count(*) AS lines_left FROM order_items WHERE order_id = 1001;
ROLLBACK;  -- puts everything back`, run: true },
    { id: 'restrict', topic: 'rules', level: 'senior', q: 'NO ACTION vs RESTRICT: what is the difference?',
      say: 'Both block deleting a parent that is still referenced. NO ACTION is the default and can be deferred to the end of the transaction if the constraint is DEFERRABLE. RESTRICT can never be deferred.',
      more: ['Without deferral, they behave the same in everyday use.',
        'Deferred constraints help when a transaction has to break the rule for a moment, like swapping two rows that point at each other.'],
      sql: `ALTER TABLE order_items
  DROP CONSTRAINT order_items_order_id_fkey,
  ADD CONSTRAINT order_items_order_id_fkey
    FOREIGN KEY (order_id) REFERENCES orders (id)
    DEFERRABLE INITIALLY DEFERRED;` },
    { id: 'gdpr', topic: 'rules', level: 'senior', hot: true, q: 'A customer with orders asks you to delete their account. What do you do?',
      say: 'I don\'t hard-delete their orders: they are financial records. I anonymise the customer row, clearing name and email, or mark it deleted, and keep the orders pointing at the same id.',
      more: ['The foreign key keeps working because the customer row still exists.',
        'If the law requires removing personal data, remove the personal columns, not the business history.',
        'Hard delete with CASCADE is only for data that has no value once the parent is gone.'],
      sql: `UPDATE customers
SET first_name = 'Deleted',
    last_name  = 'User',
    email      = 'deleted-' || id || '@example.invalid'
WHERE id = 1;`, run: true },
    { id: 'not-null', topic: 'rules', level: 'junior', q: 'How do you make sure every order has a customer?',
      say: 'A foreign key plus NOT NULL. The foreign key checks the customer exists, and NOT NULL stops orders with no customer at all.',
      more: ['A foreign key alone still allows NULL.',
        'That NOT NULL is the "exactly one" in many-to-one.'],
      sql: `INSERT INTO orders (customer_id)
VALUES (NULL);`, run: true, expect: 'error' },

    /* ---------------------------------------------------------------- postgres */
    { id: 'fk-index', topic: 'pg', level: 'mid', hot: true, q: 'Does PostgreSQL index foreign keys automatically?',
      say: 'No. Postgres indexes primary keys and UNIQUE columns, but not foreign keys. I add an index on foreign key columns I join or filter on.',
      more: ['Without it, joins from the parent get slower, and every delete of a parent row has to scan the child table to check for references.',
        'MySQL\'s InnoDB creates that index for you, which is why people assume Postgres does too.'],
      sql: `-- Our schema adds them on purpose, for example:
-- CREATE INDEX ON orders (customer_id);
SELECT tablename, indexname, indexdef
FROM pg_indexes
WHERE schemaname = 'public'
ORDER BY tablename, indexname;`, run: true },
    { id: 'identity', topic: 'pg', level: 'mid', hot: true, q: 'SERIAL or IDENTITY for ids in PostgreSQL?',
      say: 'IDENTITY. It is the SQL standard way, added in PostgreSQL 10, and GENERATED ALWAYS stops anyone inserting their own ids by mistake. SERIAL is the older shortcut for a sequence plus a default.',
      more: ['[[GENERATED BY DEFAULT]] allows a manual id when you need one, for example during an import.',
        'With GENERATED ALWAYS, an INSERT that sets id fails unless it says [[OVERRIDING SYSTEM VALUE]].',
        'Both use a sequence underneath, so gaps are normal either way.'],
      sql: `INSERT INTO customers (id, first_name, last_name, email)
VALUES (500, 'Leo', 'Hart', 'leo.hart@example.com');`, run: true, expect: 'error' },
    { id: 'uuid', topic: 'pg', level: 'senior', q: 'UUID or bigint for primary keys?',
      say: 'bigint identity is smaller and faster and fine for most apps. UUIDs help when ids are created outside the database, when merging data from several sources, or when ids in URLs must not be guessable.',
      more: ['A UUID is 16 bytes against 8, so indexes and every foreign key get bigger.',
        'Random UUIDs (version 4) land all over the index. Time-ordered UUIDs (version 7) insert in order, and PostgreSQL 18 has [[uuidv7()]] built in.',
        '[[gen_random_uuid()]] has been built in since PostgreSQL 13.'],
      sql: `SELECT gen_random_uuid() AS v4,
       uuidv7()          AS v7;`, run: true },
    { id: 'distinct-on', topic: 'pg', level: 'senior', q: 'Get each customer\'s latest order.',
      say: 'In PostgreSQL, DISTINCT ON is the shortest way: sort each customer\'s orders newest first and keep the first row per customer.',
      more: ['The ORDER BY must start with the DISTINCT ON columns.',
        'The portable version uses [[row_number() OVER (PARTITION BY customer_id ORDER BY placed_on DESC)]] and keeps row 1.'],
      sql: `SELECT DISTINCT ON (c.id)
       c.first_name, o.id AS order_id, o.placed_on
FROM customers c
JOIN orders o ON o.customer_id = c.id
ORDER BY c.id, o.placed_on DESC;`, run: true },

    /* ---------------------------------------------------------------- design */
    { id: 'normal', topic: 'design', level: 'mid', hot: true, q: 'What is normalization? Explain the first three normal forms simply.',
      say: 'Storing each fact once, in the table it belongs to. 1NF: one value per column, no lists. 2NF: with a composite key, every column depends on the whole key. 3NF: no column depends on another non-key column.',
      more: ['1NF breaks if orders has [[product_ids text]] holding \'1,6\'.',
        '2NF breaks if order_items stores product_name: it depends on product_id alone, not on the pair.',
        '3NF breaks if orders stores customer_email: it depends on customer_id, not on the order.',
        'The payoff: update a fact in one place, and nothing drifts out of sync.'] },
    { id: 'denormal', topic: 'design', level: 'senior', q: 'When would you denormalize?',
      say: 'When reads matter more than the cost of keeping copies in sync, and I have measured it. For example, storing an order total so a list page doesn\'t add up lines every time.',
      more: ['A copy that is really a different fact is not denormalization, like the price paid in order_items.',
        'Keep copies correct with a trigger or a materialized view, and write down why the copy exists.'] },
    { id: 'blog', topic: 'design', level: 'mid', hot: true, q: 'Design the tables for a blog with users, posts, comments and tags.',
      say: 'Users to posts is one-to-many, posts to comments is one-to-many, users to comments is one-to-many, and posts to tags is many-to-many through post_tags.',
      more: ['Say the relationships out loud first, then write the tables. Interviewers care about the reasoning.',
        'Comments go with their post (CASCADE). Posts should not vanish with their author, so that link blocks.',
        'Mention indexes on posts (author_id), comments (post_id) and post_tags (tag_id).'],
      sql: `CREATE TABLE users (
  id    bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
  email text   NOT NULL UNIQUE
);
CREATE TABLE posts (
  id        bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
  author_id bigint NOT NULL REFERENCES users (id),
  title     text   NOT NULL
);
CREATE TABLE comments (
  id        bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
  post_id   bigint NOT NULL REFERENCES posts (id) ON DELETE CASCADE,
  author_id bigint NOT NULL REFERENCES users (id),
  body      text   NOT NULL
);
CREATE TABLE tags (
  id   bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
  name text   NOT NULL UNIQUE
);
CREATE TABLE post_tags (
  post_id bigint NOT NULL REFERENCES posts (id) ON DELETE CASCADE,
  tag_id  bigint NOT NULL REFERENCES tags (id),
  PRIMARY KEY (post_id, tag_id)
);`, run: true,
      follow: [['How would you add replies to comments?', 'A self-reference: [[comments.parent_id bigint REFERENCES comments (id)]], NULL for top-level comments.'],
        ['How would you count comments per post quickly?', 'GROUP BY with an index on comments (post_id). Only keep a stored comment_count if you have measured that you need it.']] },
    { id: 'library', topic: 'design', level: 'senior', q: 'Design a library: books, authors, members and loans.',
      say: 'Books and authors are many-to-many through book_authors. Members and books are many-to-many over time, and the loan itself is that junction table, with dates.',
      more: ['A loan has its own id because the same member can borrow the same book many times.',
        'A partial unique index stops two open loans for one book. That is a PostgreSQL feature worth mentioning.'],
      sql: `CREATE TABLE authors (
  id   bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
  name text   NOT NULL
);
CREATE TABLE books (
  id    bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
  title text   NOT NULL
);
CREATE TABLE book_authors (
  book_id   bigint NOT NULL REFERENCES books (id),
  author_id bigint NOT NULL REFERENCES authors (id),
  PRIMARY KEY (book_id, author_id)
);
CREATE TABLE members (
  id    bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
  email text   NOT NULL UNIQUE
);
CREATE TABLE loans (
  id          bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
  book_id     bigint NOT NULL REFERENCES books (id),
  member_id   bigint NOT NULL REFERENCES members (id),
  loaned_on   date   NOT NULL DEFAULT current_date,
  returned_on date
);
-- A book can only be out once at a time
CREATE UNIQUE INDEX one_open_loan_per_book
  ON loans (book_id) WHERE returned_on IS NULL;`, run: true },

    /* ---------------------------------------------------------------- write the query */
    { id: 'no-orders', topic: 'write', level: 'junior', hot: true, q: 'Find customers who have never placed an order.',
      say: 'NOT EXISTS says it most directly. The LEFT JOIN version works too: join orders and keep the rows where the order id is NULL.',
      more: ['LEFT JOIN version: [[LEFT JOIN orders o ON o.customer_id = c.id WHERE o.id IS NULL]]. Check a NOT NULL column of the right table, like its id.',
        'On our 5 customers, the answer is Mia.'],
      sql: `SELECT c.id, c.first_name
FROM customers c
WHERE NOT EXISTS (
  SELECT 1 FROM orders o WHERE o.customer_id = c.id
)
ORDER BY c.id;`, run: true,
      follow: [['Why not WHERE c.id NOT IN (SELECT customer_id FROM orders)?', 'It works here, but if the subquery ever returns a NULL, NOT IN returns no rows at all. NOT EXISTS has no such trap.']] },
    { id: 'spend', topic: 'write', level: 'mid', q: 'Show how much each customer has spent, including customers who spent nothing.',
      say: 'LEFT JOIN all the way down so nobody is dropped, multiply quantity by the price paid, and wrap the sum in COALESCE so Mia shows 0 instead of NULL.',
      more: ['Use order_items.unit_price, the price paid, not products.unit_price.',
        'Both joins must be LEFT. One plain JOIN in the chain drops Mia again.'],
      sql: `SELECT c.first_name,
       COALESCE(sum(oi.quantity * oi.unit_price), 0) AS spent
FROM customers c
LEFT JOIN orders o       ON o.customer_id = c.id
LEFT JOIN order_items oi ON oi.order_id = o.id
GROUP BY c.id
ORDER BY spent DESC, c.id;`, run: true },
    { id: 'both', topic: 'write', level: 'senior', q: 'Find customers who bought both the Wireless Mouse (2) and the 1080p Webcam (5).',
      say: 'Join down to order_items, keep only those two products, group by customer, and keep the groups with two distinct products.',
      more: ['count(DISTINCT ...) matters. Emma bought the mouse and the webcam in different orders, and still counts.',
        'This pattern is called relational division. It comes up a lot in many-to-many questions.'],
      sql: `SELECT c.id, c.first_name
FROM customers c
JOIN orders o       ON o.customer_id = c.id
JOIN order_items oi ON oi.order_id = o.id
WHERE oi.product_id IN (2, 5)
GROUP BY c.id
HAVING count(DISTINCT oi.product_id) = 2
ORDER BY c.id;`, run: true },
    { id: 'multi', topic: 'write', level: 'junior', q: 'List orders that contain more than one product.',
      say: 'Group the junction table by order and keep the groups with [[HAVING count(*) > 1]]. HAVING filters groups, WHERE filters rows.',
      more: ['You don\'t even need the orders table: order_items already has order_id.'],
      sql: `SELECT order_id, count(*) AS products
FROM order_items
GROUP BY order_id
HAVING count(*) > 1
ORDER BY order_id;`, run: true },
    { id: 'unsold', topic: 'write', level: 'junior', q: 'Find products nobody has ever ordered.',
      say: 'Same shape as customers with no orders: NOT EXISTS against the junction table.',
      more: ['On the 5-customer slice every product has been ordered, so this runs on the full store.'],
      sql: `SELECT p.id, p.name
FROM products p
WHERE NOT EXISTS (
  SELECT 1 FROM order_items oi WHERE oi.product_id = p.id
)
ORDER BY p.id;`, run: true, data: 'full' },
    { id: 'dupe-names', topic: 'write', level: 'mid', q: 'Find customers who share the same full name.',
      say: 'Group by the name and keep the groups with more than one row. [[array_agg]] lists their ids in one column.',
      more: ['On the full store, there are two John Smiths: ids 2 and 61. That is exactly why names can\'t be keys.'],
      sql: `SELECT first_name, last_name, array_agg(id ORDER BY id) AS ids
FROM customers
GROUP BY first_name, last_name
HAVING count(*) > 1;`, run: true, data: 'full' },
  ];

  window.IVContent = { TOPICS, QUESTIONS: Q };
})();

</script>
<script>
/* Shared helpers: DOM builder, stage scaling, theme, fullscreen, keys, toasts, JSON view. */
(function () {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    if (props) {
      for (const [k, v] of Object.entries(props)) {
        if (v === null || v === undefined || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'html') el.innerHTML = v;
        else if (k === 'text') el.textContent = v;
        else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
        else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
        else if (k === 'data') for (const [dk, dv] of Object.entries(v)) el.dataset[dk] = dv;

    const plain = (x) => JSON.stringify(x).replace(/","/g, '", "').replace(/":/g, '": ').replace(/,"/g, ', "').replace(/^\{/, '{ ').replace(/\}$/, ' }');
