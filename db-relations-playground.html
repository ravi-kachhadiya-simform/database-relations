<script>
/* Table cards, link lines, and the JOIN step player. */
(function () {
  const { h, esc, rel } = window.UI;
  const E = window.Engine;
  const MONEY = new Set(['unit_price']);
  const KEY_SVG = '<svg class="ico" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M15 8l2 2"/></svg>';
  const LINK_SVG = '<svg class="ico" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>';

  function fmt(v, col) {
    if (v === null || v === undefined) return 'NULL';
    if (typeof v === 'number' && MONEY.has(col)) return v.toFixed(2);
    if (typeof v === 'object') return JSON.stringify(v).replace(/,"/g, ', "').replace(/":/g, '": ').replace(/},{/g, '}, {');
    return String(v);
  }

  /* column metadata for a store table, honouring constraints switched off in db */
  function storeCols(table, names, db) {
    return names.map((name) => {
      const pk = E.PK[table].includes(name);
      const fk = E.FKS.find((f) => f.t === table && f.cols.includes(name));
      const unique = E.UNIQUES[table].some((u) => u.cols.length === 1 && u.cols[0] === name && (!db || db.isOn(u.name)));
      return { name, pk, fk: fk ? fk.ref : null, unique };
    });
  }

  function card(o) {
    const head = h('div', { class: 'tcard-head' }, h('span', { class: 'tdot' }), h('span', null, o.title),
      o.alias ? h('span', { class: 'alias' }, o.alias) : null, o.badge ? h('span', { class: 'badge', html: o.badge }) : null);
    const thead = h('tr', null, o.cols.map((c) => h('th', {
      class: [c.pk ? 'pk' : '', c.fk ? 'fk c-' + c.fk : ''].join(' ').trim() || null, 'data-col': c.name,
    }, h('span', { class: 'th-in', html: (c.pk ? KEY_SVG : '') + (c.fk ? LINK_SVG : '') + esc(c.label || c.name) + (c.unique ? ' <span class="uq">UNIQUE</span>' : '') }))));
    const body = h('tbody');
    for (const r of o.rows) body.append(row(o, r));
    if (!o.rows.length) body.append(h('tr', { class: 'empty-row' }, h('td', { colspan: o.cols.length }, o.empty || 'No rows')));
    const el = h('div', { class: `tcard t-${o.color || o.table}`, 'data-table': o.alias || o.table }, head,
      h('table', null, h('thead', null, thead), body));
    if (o.width) el.style.width = o.width + 'px';
    return el;
  }
  function row(o, r) {
    return h('tr', { 'data-key': r.key, class: r.cls || null }, o.cols.map((c) => {
      const v = r.vals[c.name];
      const cls = [c.pk ? 'pkc' : '', c.fk ? 'fkc c-' + c.fk : '', v === null || v === undefined ? 'null' : '',
        MONEY.has(c.name) ? 'money' : '', (r.bad || []).includes(c.name) ? 'bad' : '', (r.chg || []).includes(c.name) ? 'chg' : ''].join(' ').trim();
      return h('td', { class: cls || null, 'data-col': c.name }, fmt(v, c.name));
    }));
  }

  /* links: [{ from: el, to: el, color, cls }] drawn as curves from one row edge to another */
  function drawLinks(svg, box, links) {
    svg.innerHTML = '';
    const NS = 'http://www.w3.org/2000/svg';
    for (const L of links) {
      if (!L.from || !L.to) continue;
      const a = rel(L.from, box), b = rel(L.to, box);
      const ay = a.y + a.h / 2, by = b.y + b.h / 2;
      let x1, x2, d;
      if (a.x + a.w <= b.x + 1) { x1 = a.x + a.w; x2 = b.x; d = Math.max(28, (x2 - x1) / 2); }
      else if (b.x + b.w <= a.x + 1) { x1 = a.x; x2 = b.x + b.w; d = -Math.max(28, (x1 - x2) / 2); }
      else { x1 = a.x + a.w; x2 = b.x + b.w; d = 0; }
      const p = document.createElementNS(NS, 'path');
      const dpath = d === 0
        ? `M${x1},${ay} C${x1 + 70},${ay} ${x2 + 70},${by} ${x2},${by}`
        : `M${x1},${ay} C${x1 + d},${ay} ${x2 - d},${by} ${x2},${by}`;
      p.setAttribute('d', dpath);
      p.setAttribute('class', 'link ' + (L.cls || ''));
      p.style.setProperty('--lc', L.color || 'var(--c-neutral)');
      svg.append(p);
      for (const [x, y, r] of [[x1, ay, 3], [x2, by, 4.5]]) {
        const c = document.createElementNS(NS, 'circle');
        c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', r);
        c.setAttribute('class', 'link-dot ' + (L.cls === 'faint' ? 'faint' : ''));
        c.style.setProperty('--lc', L.color || 'var(--c-neutral)');
        svg.append(c);
      }
    }
  }

  /* ------------------------------------------------------------ JOIN player */
  const Q = () => window.Query;
  class JoinPlayer {
    constructor(parts, opts = {}) {
      this.p = parts; // { stage, cap, res }
      this.opts = opts;
      this.svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      this.svg.setAttribute('class', 'links');
      this.timer = null;
      window.addEventListener('stage-resize', () => this.redrawLinks());
    }
    load(q, db, show, preview) {
      this.stop();
      this.q = q; this.db = db; this.show = show; this.preview = preview;
      this.fr = Q().frames(q, db);
      this.final = Q().evaluate(q, db);
      this.i = -1;
      this.aliases = [q.from[1], ...q.joins.map((j) => j.a)];
      const stage = this.p.stage;
      stage.innerHTML = '';
      this.cards = {};
      const wrap = h('div', { class: 'jp-cards' });
      for (const a of this.aliases) {
        const t = this.fr.tab[a];
        const cols = storeCols(t, show[a], db);
        const rows = Q().joinRows({ from: [t, 'x'], joins: [] }, db).map((r) => ({ key: E.keyOf(t, r.x), vals: r.x }));
        const c = card({ table: t, title: t, alias: a, cols, rows, color: t });
        this.cards[a] = c;
        wrap.append(c);
      }
      stage.append(wrap, this.svg);
      this.renderResult(0, false);
      this.caption(this.opts.ready || 'Press <b>Play</b> to watch Postgres match the rows, or <b>Step</b> to go one row at a time.');
      if (this.opts.onChange) this.opts.onChange(this);
    }
    get done() { return this.i >= this.fr.steps.length - 1; }
    caption(html) { if (this.p.cap) this.p.cap.innerHTML = html; }
    resultCols(grouped) {
      if (grouped || !this.fr.grouped) return this.final.cols;
      return this.preview.map((r) => (r.includes('.') ? r.split('.')[1] : r));
    }
    renderResult(upto, grouped, fresh) {
      const cols = this.resultCols(grouped);
      let rows;
      if (grouped || !this.fr.grouped) rows = grouped ? this.final.rows : this.final.rows.slice(0, upto);
      else rows = this.fr.flat.slice(0, upto).map((r) => this.preview.map((c) => Q().val(r, c)));
      const n = rows.length;
      const tb = h('tbody', null, rows.map((r, i) => h('tr', { class: fresh && i >= fresh ? 'new' : null },
        r.map((v, j) => h('td', { class: [v === null ? 'null' : '', v !== null && typeof v === 'object' ? 'json' : ''].join(' ').trim() || null }, fmt(v, cols[j]))))));
      const table = h('table', { class: 'rtable' }, h('thead', null, h('tr', null, cols.map((c) => h('th', null, c)))), tb);
      this.p.res.innerHTML = '';
      const label = grouped ? `${n} ${n === 1 ? 'row' : 'rows'} after GROUP BY` : `${n} ${n === 1 ? 'row' : 'rows'} so far`;
      this.p.res.append(h('div', { class: 'jp-count' }, h('b', null, this.done ? `${n} ${n === 1 ? 'row' : 'rows'}` : label)), table);
      const last = this.p.res.querySelector('tr.new:last-child');
      if (last) last.scrollIntoView({ block: 'nearest' });
    }
    clear() {
      for (const c of Object.values(this.cards)) {
        c.querySelectorAll('tr').forEach((tr) => tr.classList.remove('hl', 'dim', 'done', 'miss'));
        c.querySelectorAll('td.on').forEach((td) => td.classList.remove('on'));
      }
      this.svg.innerHTML = '';
      this.links = [];
    }
    apply(i) {
      this.clear();
      const st = this.fr.steps[i];
      const prevUpto = i > 0 && !this.fr.steps[i - 1].group ? this.fr.steps[i - 1].upto : 0;
      if (st.group) {
        Object.values(this.cards).forEach((c) => c.querySelectorAll('tbody tr').forEach((tr) => tr.classList.add('done')));
        this.caption(st.caption);
        this.renderResult(0, true, 0);
        this.p.res.classList.remove('squash'); void this.p.res.offsetWidth; this.p.res.classList.add('squash');
        return;
      }
      const a0 = this.aliases[0];
      const c0 = this.cards[a0];
      const steps = this.fr.steps.filter((s) => !s.group);
      const idx = steps.indexOf(st);
      c0.querySelectorAll('tbody tr').forEach((tr, k) => { if (k < idx) tr.classList.add('done'); });
      for (const a of this.aliases.slice(1)) this.cards[a].querySelectorAll('tbody tr').forEach((tr) => tr.classList.add('dim'));
      for (const [a, keys] of Object.entries(st.hl)) {
        for (const k of keys) {
          const tr = this.cards[a].querySelector(`tr[data-key="${k}"]`);
          if (tr) { tr.classList.remove('dim', 'done'); tr.classList.add('hl'); }
        }
      }
      if (!st.made && st.notes.some((n) => n.kind === 'drop')) {
        const tr = c0.querySelector(`tr[data-key="${st.key}"]`);
        if (tr) tr.classList.add('miss');
      }
      this.links = st.links.map((L) => {
        const fromTr = this.cards[L.from[0]].querySelector(`tr[data-key="${L.from[1]}"]`);
        const toTr = this.cards[L.to[0]].querySelector(`tr[data-key="${L.to[1]}"]`);
        if (fromTr && L.from[2]) { const td = fromTr.querySelector(`td[data-col="${L.from[2]}"]`); if (td) td.classList.add('on'); }
        if (toTr && L.to[2]) { const td = toTr.querySelector(`td[data-col="${L.to[2]}"]`); if (td) td.classList.add('on'); }
        const parentAlias = L.to[2] === 'id' ? L.to[0] : L.from[2] === 'id' ? L.from[0] : L.to[0];
        return { from: fromTr, to: toTr, color: `var(--c-${this.fr.tab[parentAlias]})`, cls: 'hl' };
      });
      this.redrawLinks();
      this.caption(st.caption);
      this.renderResult(st.upto, false, prevUpto);
    }
    redrawLinks() { if (this.links && this.p.stage.isConnected) drawLinks(this.svg, this.p.stage, this.links); }
    next() {
      if (this.done) return false;

      this.apply(this.i);
      if (this.opts.onChange) this.opts.onChange(this);
      return true;
    }
    finish() {
      this.stop();
      this.i = this.fr.steps.length - 1;
      this.clear();
      Object.values(this.cards).forEach((c) => c.querySelectorAll('tbody tr').forEach((tr) => tr.classList.add('done')));
      this.renderResult(this.final.rows.length, this.fr.grouped, this.final.rows.length);
      this.caption(this.opts.finished ? this.opts.finished(this) : 'Done.');
      if (this.opts.onChange) this.opts.onChange(this);
    }
    reset() { this.load(this.q, this.db, this.show, this.preview); }
    play(ms) {
      this.stop();
      if (this.done) this.reset();
      this.playing = true;
      const tick = () => {
        if (!this.next()) { this.stop(); if (this.opts.onEnd) this.opts.onEnd(this); return; }
        if (this.done) { this.stop(); if (this.opts.onEnd) this.opts.onEnd(this); return; }
        this.timer = setTimeout(tick, ms || this.opts.speed || 1400);
      };
      tick();
      if (this.opts.onChange) this.opts.onChange(this);
    }
    stop() { clearTimeout(this.timer); this.timer = null; const was = this.playing; this.playing = false; if (was && this.opts.onChange) this.opts.onChange(this); }
  }

  window.Viz = { card, row, storeCols, drawLinks, fmt, JoinPlayer, KEY_SVG, LINK_SVG };
})();

  function verdictInfo(P, kind) {
    const A = P.a, B = P.b;
    if (!kind) return { title: 'Answer both questions', lines: ['Two questions, one in each direction. Your answers decide where the foreign key goes.'] };
    const M = D.model(P, kind);
    if (P.self) {
      const N = D.selfNames(P);
      if (kind === 'MN') return { title: 'Many-to-many', lines: [`Both sides are ${A.table}, so the junction table points at the same table twice.`], fk: `${N.junction} (${N.jA}, ${N.jB})`, people: 'Like a club where members vouch for each other: one sheet lists every pair.' };
      return { title: kind === '11' ? 'One-to-one' : kind === 'N1' ? 'Many-to-one' : 'One-to-many',
        lines: [kind === '1N' ? `One ${A.one} leads many ${B.many}. Each ${B.one} has one ${A.one}.` : kind === '11' ? `Each ${A.one} leads at most one ${B.one}.` : `Each ${A.one} leads one ${B.one}, and a ${B.one} can have many ${A.many}.`,
          `${A.many.charAt(0).toUpperCase() + A.many.slice(1)} are ${B.many} too, so the table points at itself. The top one has NULL.`],
        fk: `${A.table}.${M.fk}${kind === '11' ? ' UNIQUE' : ''} points at ${A.table}.id`, people: 'Like a family tree: everyone is a person, and each person points at their parent in the same list.' };
    }
    switch (kind) {
      case '1N': return { title: 'One-to-many', lines: [`One ${A.one} has many ${B.many}. Each ${B.one} has one ${A.one}.`, `Read from the ${B.one} side, it is many-to-one. Same link.`],
        fk: `${M.child.table}.${M.fk} points at ${M.parent.table}.id`, people: 'Like a father and his children: one father, many children, and each child has one father.' };
      case 'N1': return { title: 'Many-to-one', lines: [`Each ${A.one} has one ${B.one}. One ${B.one} has many ${A.many}.`, `It is one-to-many read from the other end, so the key sits in ${A.table}.`],
        fk: `${M.child.table}.${M.fk} points at ${M.parent.table}.id`, people: 'Like children and their father, told from the children\'s side.' };
      case '11': return { title: 'One-to-one', lines: [`One ${A.one} has at most one ${B.one}, and the other way round.`, 'It is a normal foreign key plus UNIQUE. Without UNIQUE it would be one-to-many.'],
        fk: `${M.child.table}.${M.fk} UNIQUE points at ${M.parent.table}.id`, people: 'Like a person and their passport: one each.' };
      default: return { title: 'Many-to-many', lines: [`One ${A.one} has many ${B.many}, and one ${B.one} has many ${A.many}.`, 'Neither table can hold the key, so a junction table holds one row per pair.'],
        fk: `${M.junction.table} (${M.fkA}, ${M.fkB})`, people: 'Like students and clubs: the sign-up sheet in the middle is the junction table.' };
    }
  }

  function renderDesign(pairChanged) {

      ver.append(tk === kind ? h('div', { class: 'check ok' }, P.store ? '✅ That matches our store.' : '✅ That is how it usually works.')
        : h('div', { class: 'check no' }, `${P.store ? '⚠️ Our store works differently: ' : '⚠️ Usually it works differently: '}${say(P.truth[0], P.truth[1])}.`));

    if (DS.lastKind !== kind || pairChanged || DS.lastPairKey !== P.a.table + P.b.table) renderDiagram(P, kind, !pairChanged);
    DS.lastKind = kind;
    DS.lastPairKey = P.a.table + P.b.table;
  }

  function renderDiagram(P, kind, animate) {
    const box = $('#dzDiagram');
    if (!box.isConnected || !box.offsetParent) return;
    const oldTh = box.querySelector('th.fk');
    const oldR = oldTh && animate ? rel(oldTh, box) : null;
    box.innerHTML = '';
    const tcard = (T) => V.card({ table: T.table, title: T.table, color: T.color,
      cols: T.cols.map((c) => ({ name: c.name, pk: c.pk || c.pkPart, fk: c.fk ? colorOf(P, c.fk) : null, unique: c.unique })),
      rows: T.rows.map((r) => ({ key: r.id !== undefined ? String(r.id) : Object.values(r).slice(0, 2).join(':'), vals: r })) });
    if (!kind) {
      const list = P.self ? [P.a] : [P.a, P.b];
      list.forEach((T) => box.append(tcard({ ...T, cols: [{ name: 'id', pk: true }, { name: T.col }], rows: T.rows.map(([id, v]) => ({ id, [T.col]: v })) })));
      box.append(h('div', { class: 'hint' }, 'No link yet. Answer the two questions.'));
      return;
    }
    const M = D.model(P, kind);
    const list = kind === 'MN' ? (M.self ? [M.parentFirst[0], M.junction] : [M.A, M.junction, M.B]) : M.self ? [M.child] : [M.A, M.B];
    box.classList.toggle('three', list.length === 3);
    const cards = list.map((T) => { const c = tcard(T); c.dataset.t = T.table + (T === M.junction ? '#j' : ''); box.append(c); return c; });
    const svg = svgEl();
    box.append(svg);
    requestAnimationFrame(() => {
      const links = [];
      const labels = [];
      list.forEach((T, i) => {
        T.cols.filter((c) => c.fk).forEach((c) => {
          const parentIdx = list.findIndex((X) => X.table === c.fk && X !== M.junction);
          const pc = cards[parentIdx];
          cards[i].querySelectorAll('tbody tr').forEach((tr, ri) => {
            const v = T.rows[ri][c.name];
            if (v === null || v === undefined) return;
            const ptr = pc.querySelector(`tbody tr[data-key="${v}"]`);
            if (ptr) links.push({ from: tr, to: ptr, color: `var(--c-${colorOf(P, c.fk)})` });
          });
          if (!M.self) labels.push([pc, cards[i], c.unique]);
        });
      });
      V.drawLinks(svg, box, links);
      for (const [pc, cc, uniq] of labels) {
        const a = rel(pc, box), b = rel(cc, box);
        const leftToRight = a.x < b.x;
        const y = Math.max(a.y, b.y) + 22;
        const px = leftToRight ? a.x + a.w + 4 : a.x - 4, cx = leftToRight ? b.x - 4 : b.x + b.w + 4;
        box.append(h('span', { class: 'endlbl', style: { left: px + 'px', top: y + 'px', transform: `translate(${leftToRight ? '0' : '-100%'}, -50%)` } }, 'one'));
        box.append(h('span', { class: 'endlbl' + (uniq ? '' : ' many'), style: { left: cx + 'px', top: y + 'px', transform: `translate(${leftToRight ? '-100%' : '0'}, -50%)` } }, uniq ? 'one' : 'many'));
      }
      const newTh = box.querySelector('th.fk');
      if (oldR && newTh && !UI.reduced()) {
        const nr = rel(newTh, box);
        if (Math.abs(nr.x - oldR.x) + Math.abs(nr.y - oldR.y) > 30) {
          const chip = h('span', { class: 'flychip', style: { left: oldR.x + 'px', top: oldR.y + 'px' } }, '🔗 ' + newTh.textContent.replace('UNIQUE', '').trim());
          box.append(chip);
          requestAnimationFrame(() => { chip.style.transform = `translate(${nr.x - oldR.x}px, ${nr.y - oldR.y}px)`; });
          setTimeout(() => { chip.style.opacity = '0'; }, 750);
          setTimeout(() => chip.remove(), 1100);
        }
      }
    });
  }

  function optionsFor(d) {
    const db = CS.db;

    if (d.type === 'customer') list = db.rows('customers').map((c) => [c.id, `${c.first_name} (${c.id})`]);
    if (d.type === 'order') list = db.rows('orders').map((o) => [o.id, String(o.id)]);

    for (const x of d.extra || []) list.push(x === 'nobody' ? [999, '999 (nobody)'] : [null, 'NULL (nobody)']);
    return list;
  }
  function valuesFor(a) {
    const cur = CS.fields[a.id] || {};
    const out = {};
    for (const [k, d] of Object.entries(a.fields || {})) {
      if (d.type === 'text') { out[k] = (cur[k] !== undefined ? cur[k] : d.def).trim(); continue; }
      const opts = optionsFor(d);
      const real = opts.filter((o) => o[0] !== 999 && o[0] !== null);
      let v = cur[k];
      if (v === undefined || !opts.some((o) => o[0] === v)) {
        if (d.def === 'last') v = (real[real.length - 1] || opts[0])[0];
        else v = opts.some((o) => o[0] === d.def) ? d.def : (opts[0] ? opts[0][0] : null);
      }
      out[k] = v;
    }
    return out;
  }

  function runAction(a) {
    execute(a.stmt(valuesFor(a), CS.db));
  }

  function execute(stmt) {
    const before = CS.db.clone();
    const res = CS.db.run(stmt);
    if (stmt.op === 'insert' && stmt.table === 'loyalty_cards') C.bumpCard();
    CS.log.push({ res, why: explain(stmt, res, before), side: sideEffects(res) });
    CS.marks = marksFor(stmt, res, before);
    pickFocus(stmt, res, before);
    if (res.ok && res.changes.deleted.some((d) => CS.sc.tables.includes(d.table))) {
      renderTables(before, { ...CS.marks, leavingOnly: true });
      setTimeout(() => { renderTables(CS.db, CS.marks); }, 1100);
    } else renderTables(CS.db, CS.marks);
    renderLog();
    renderApi();
    renderChangeLeft();
  }

  function badCols(e, stmt) {
    if (e.kind === 'notnull' || e.kind === 'identity') return [e.column];
    if (e.kind === 'check') return [{ order_items_quantity_check: 'quantity', loyalty_cards_tier_check: 'tier', products_unit_price_check: 'unit_price' }[e.constraint]];
    if (e.cols) return e.cols;
    return [];
  }
  function marksFor(stmt, res, before) {
    const m = { new: {}, chg: {}, leaving: {}, via: {}, blocked: {}, ghost: null, bad: {}, badLinks: [] };
    const add = (o, t, k) => { (o[t] = o[t] || new Set()).add(String(k)); };
    if (res.ok) {
      res.changes.inserted.forEach((x) => add(m.new, x.table, x.key));
      res.changes.updated.concat(res.changes.nulled).forEach((x) => { (m.chg[x.table] = m.chg[x.table] || {})[x.key] = x.cols; });
      res.changes.deleted.forEach((x) => { add(m.leaving, x.table, x.key); if (x.via) add(m.via, x.table, x.key); });
      return m;
    }
    const e = res.error;
    if (e.kind === 'fk-delete') {
      add(m.blocked, e.table, e.parentKey);
      e.blockers.forEach((k) => { add(m.blocked, e.child, k); m.badLinks.push([e.child, String(k)]); });
    } else if (stmt.op === 'insert') {
      let row = e.row;
      if (!row) { row = {}; E.COLS[stmt.table].forEach((c) => { const i = stmt.cols.indexOf(c.name); row[c.name] = i >= 0 ? stmt.vals[i] : null; }); }
      m.ghost = { table: stmt.table, row, bad: badCols(e, stmt), fk: e.kind === 'fk' ? e.ref : null };
      if (e.clashKey) add(m.blocked, e.table, e.clashKey);
    } else if (stmt.op === 'update') {
      before.find(stmt.table, stmt.where).forEach((r) => { const k = E.keyOf(stmt.table, r); add(m.blocked, stmt.table, k); (m.bad[stmt.table] = m.bad[stmt.table] || {})[k] = badCols(e, stmt); });
    } else if (stmt.op === 'addUnique') {
      const counts = {};
      before.rows(stmt.table).forEach((r) => { counts[r.customer_id] = (counts[r.customer_id] || 0) + 1; });
      before.rows(stmt.table).filter((r) => counts[r.customer_id] > 1).forEach((r) => add(m.blocked, stmt.table, E.keyOf(stmt.table, r)));
    }
    return m;
  }

  function renderTables(db, marks) {
    const canvas = $('#czCanvas');
    if (!canvas || !canvas.offsetParent) return;
    const S = CS.sc;
    marks = marks || {};
    canvas.innerHTML = '';
    CS.cards = {};
    CS.view = { db, marks };
    for (const t of S.tables) {
      const cols = V.storeCols(t, S.show[t], db);
      const rows = [...db.rows(t)].sort((a, b) => (t === 'order_items' ? (a.order_id - b.order_id) || (a.product_id - b.product_id) : a.id - b.id)).map((r) => {
        const key = E.keyOf(t, r);
        const has = (o) => o[t] && o[t].has(key);
        let cls = null;
        if (marks.leavingOnly) cls = has(marks.leaving || {}) ? 'leaving' : null;
        else if (has(marks.new || {})) cls = 'new';
        else if (has(marks.blocked || {})) cls = 'blocked';
        else if (marks.chg && marks.chg[t] && marks.chg[t][key]) cls = 'changed';
        return { key, vals: r, cls, chg: marks.leavingOnly ? [] : (marks.chg && marks.chg[t] && marks.chg[t][key]) || [], bad: (marks.bad && marks.bad[t] && marks.bad[t][key]) || [] };
      });
      if (!marks.leavingOnly && marks.ghost && marks.ghost.table === t) rows.push({ key: 'ghost', vals: marks.ghost.row, cls: 'ghost', bad: marks.ghost.bad });

  function explain(stmt, res, before) {
    const t = stmt.table;
    if (!res.ok) {
      const e = res.error;
      const row = e.row || {};
      switch (e.kind) {
        case 'identity':
          return stmt.op === 'update'
            ? 'A primary key never changes. Other tables point at this number, so Postgres refuses to edit an identity id.'
            : 'Postgres picks the id, every time. Leave <code class="inl">id</code> out of the INSERT and let it hand out the next number.';
        case 'pk':
          if (t === 'order_items') return `Order ${row.order_id} already has ${pname(before, row.product_id)}. The pair (order_id, product_id) is the primary key, so each product appears once per order. To buy more, change the quantity.`;
          return `id ${row.id} already belongs to ${who(before, row.id)}. A primary key never repeats.`;
        case 'unique':
          if (e.constraint === 'customers_email_key') {
            const owner = before.rows('customers').find((c) => c.email === row.email);
            return `${owner ? owner.first_name : 'Someone'} already uses that email. UNIQUE means no two customers can share one, even though email is not the primary key.`;
          }
          if (e.constraint === 'loyalty_cards_customer_id_key') {
            return stmt.op === 'addUnique'
              ? 'A customer has two cards right now, so Postgres can\'t switch UNIQUE back on. Delete one of the cards first.'
              : `${who(before, row.customer_id)} already has a card. UNIQUE on customer_id is the only thing that makes this one-to-one.`;
          }
          return 'That card number is already taken.';
        case 'fk': {
          const v = row[e.cols[0]];
          return `There is no ${NOUN[e.ref][0]} ${v}, so this row would point at nothing. The foreign key stops it.`;
        }
        case 'fk-delete': {
          const n = e.blockers.length;
          if (e.table === 'products') return `${pname(before, Number(e.parentKey)).replace(/^the/, 'The')} is in ${nounN('orders', n).replace('orders', 'order lines').replace('order ', 'order line ')}. Old orders must keep pointing at it, so Postgres blocks the delete. Shops usually hide old products instead.`;
          return `${who(before, Number(e.parentKey))} still has ${nounN('orders', n)} pointing at them. Postgres won't leave orders pointing at nobody. Move or delete those orders first.`;
        }
        case 'notnull': {
          let s = e.column === 'customer_id'
            ? `customer_id is NOT NULL, so every ${t === 'orders' ? 'order' : 'card'} needs a customer. That is the "one" in many-to-one.`
            : `${e.column} is NOT NULL, so it can't be empty.`;
          if (res.consumed.length) s += ` Postgres had already used ${res.consumed[0].table === 'orders' ? 'order' : 'id'} ${res.consumed[0].from} for this row, so the next one skips it. Gaps in ids are normal.`;
          return s;
        }
        case 'check':
          return e.constraint === 'order_items_quantity_check' ? 'quantity has CHECK (quantity &gt; 0). Zero of something is not an order line.'
            : e.constraint === 'loyalty_cards_tier_check' ? 'tier has a CHECK rule: only bronze, silver or gold.' : 'A CHECK rule said no.';
        default:
          return '';
      }
    }
    switch (stmt.op) {
      case 'insert': {
        const r = res.changes.inserted[0].row;
        if (t === 'customers') {
          const same = before.rows('customers').find((c) => c.first_name === r.first_name && c.last_name === r.last_name);
          return same ? `Two ${esc(r.first_name)} ${esc(r.last_name)}s is fine: names can repeat. Their ids (${same.id} and ${r.id}) are different, and the id is what other tables point at.`
            : `Postgres picked id ${r.id} by itself: the next number on its counter.`;
        }
        if (t === 'orders') return `Order ${r.id} now points at ${who(before, r.customer_id)} (customer_id ${r.customer_id}). In the JSON, the orders array got one more item.`;
        if (t === 'loyalty_cards') {
          const n = CS.db.rows('loyalty_cards').filter((x) => x.customer_id === r.customer_id).length;
          return n > 1 ? `${who(before, r.customer_id)} now has ${n} cards. Without UNIQUE this is one-to-many, so the JSON had to become an array.`
            : `${who(before, r.customer_id)} now has a card. loyalty_cards.customer_id points at them.`;
        }
        if (t === 'order_items') return `One new row in the junction table: order ${r.order_id} now has ${pname(before, r.product_id)}. One row per pair, two foreign keys.`;
        return '';
      }
      case 'update':
        if (res.tag === 'UPDATE 0') return 'Nothing matched the WHERE, so nothing changed.';
        if (t === 'orders') return `Order ${stmt.where.id} now points at ${who(before, stmt.set.customer_id)}. Moving an order is just changing one number.`;
        if (t === 'order_items') return 'Same pair, new quantity. The key stays the same, so there is no duplicate.';
        return 'Updated.';
      case 'delete': {
        if (res.tag === 'DELETE 0') return 'Nothing matched the WHERE, so nothing was deleted.';
        const main = res.changes.deleted.filter((d) => !d.via);
        const d0 = main[0];
        const label = t === 'customers' ? d0.row.first_name : t === 'orders' ? `order ${d0.row.id}` : t === 'products' ? d0.row.name : t === 'loyalty_cards' ? `${main.length > 1 ? main.length + ' cards' : 'the card'} of ${who(before, d0.row.customer_id)}` : `${pname(before, d0.row.product_id)} from order ${d0.row.order_id}`;
        return `Deleted ${esc(label)}.` + (res.changes.deleted.some((d) => d.via) || res.changes.nulled.length ? ' Postgres also followed the ON DELETE rules below.' : ' Nothing else pointed at it.');
      }
      case 'dropConstraint': return 'UNIQUE is off. Postgres will now accept a second card for the same customer. Try "A second card for Emma".';
      case 'addUnique': return 'UNIQUE is back on. One customer, at most one card.';
      default: return '';
    }
  }
  function sideEffects(res) {
    if (!res.ok) return '';
    const parts = [];
    const by = {};
    res.changes.deleted.filter((d) => d.via).forEach((d) => { by[d.table] = (by[d.table] || 0) + 1; });
    for (const [t, n] of Object.entries(by)) parts.push(`Also deleted ${nounN(t, n)} from ${t} (ON DELETE CASCADE).`);
    if (res.changes.nulled.length) parts.push(`Also set referred_by to NULL for ${nounN('customers', res.changes.nulled.length)} they had invited (ON DELETE SET NULL).`);
    return parts.join(' ');
  }

    if (isOrderApi) {
      id = get('order_id') !== undefined ? get('order_id') : stmt.table === 'orders' ? get('id') : undefined;

      [[['1', '2', '3', '4', '5'], 'Switch tab: Design, Change, JOIN, Write, Interview'], [['Space'], 'Play the JOIN, or show an interview answer'], [['←', '→'], 'Next JOIN step, or the next question'], [['R'], 'Restart the JOIN, or mark a question to review'], [['K'], 'Mark an interview question as known'],
        [['Ctrl', 'Enter'], 'Run the SQL in Write SQL'], [['Space', 'P'], 'Playground (hold Space, press P)'], [['Space', 'G'], 'Game'], [['Space', 'S'], 'Back to the story'], [['T'], 'Light or dark'], [['F'], 'Full screen'], [['?'], 'This help'], [['Esc'], 'Close']]
        .map(([ks, d]) => [h('dt', null, ks.map((k) => h('kbd', null, k))), h('dd', null, d)]))), { width: 620 });
  }

  function init() {
    UI.init();
    $$('.mode-btn').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));
    $('#helpBtn').addEventListener('click', help);
    buildDesign();
    buildChange();
    buildJoin();
    buildWrite();
    buildInterview();
    renderChange();
    loadJoin();
    ['design', 'change', 'join', 'write', 'interview'].forEach((m, i) => onKey(String(i + 1), () => setMode(m)));
    onKey('?', help);
    onKey(' ', () => { if (mode === 'join') togglePlay(); else if (mode === 'interview') ivToggle(); else return false; });
    onKey('ArrowRight', () => { if (mode === 'join') { JS.player.stop(); JS.player.next(); } else if (mode === 'interview') ivGo(1); else return false; });
    onKey('ArrowLeft', () => { if (mode === 'interview') ivGo(-1); else return false; });
    onKey('r', () => { if (mode === 'join') JS.player.reset(); else if (mode === 'interview') ivMark('review'); else return false; });
    onKey('k', () => { if (mode === 'interview') ivMark('known'); else return false; });
    window.addEventListener('stage-resize', () => { if (mode === 'design') renderDiagram(dPair(), D.kindOf(DS.q1, DS.q2), false); });
    setMode((location.hash || '').slice(1) || 'design');
    window.PG = { DS, CS, JS, WS, IVS, setMode, execute, renderDesign, runSQL, setEditor, ensurePG, switchData };
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

,3]],"affected":0}]},"small|SELECT c.first_name, o.id AS order_id\nFROM customers c\nLEFT JOIN orders o ON o.customer_id = c.id\nORDER BY c.id, o.id;":{"ok":true,"results":[{"fields":["first_name","order_id"],"rows":[["Emma",1001],["Emma",1026],["Emma",1098],["John",1002],["Olivia",1003],["James",1007],["Mia",null]],"affected":0}]},"small|SELECT c.first_name, count(*) AS rows_after_join\nFROM customers c\nJOIN orders o ON o.customer_id = c.id\nGROUP BY c.id\nORDER BY c.id;":{"ok":true,"results":[{"fields":["first_name","rows_after_join"],"rows":[["Emma",3],["John",1],["Olivia",1],["James",1]],"affected":0}]},"small|SELECT c.first_name,\n       count(*)    AS count_star,\n       count(o.id) AS count_id\nFROM customers c\nLEFT JOIN orders o ON o.customer_id = c.id\nGROUP BY c.id\nORDER BY c.id;":{"ok":true,"results":[{"fields":["first_name","count_star","count_id"],"rows":[["Emma",3,3],["John",1,1],["Olivia",1,1],["James",1,1],["Mia",1,0]],"affected":0}]},"small|-- Customers with their delivered orders, keeping customers with none\nSELECT c.first_name, o.id AS order_id\nFROM customers c\nLEFT JOIN orders o\n  ON o.customer_id = c.id\n AND o.status = 'delivered'\nORDER BY c.id, o.id;":{"ok":true,"results":[{"fields":["first_name","order_id"],"rows":[["Emma",1001],["Emma",1026],["Emma",1098],["John",1002],["Olivia",1003],["James",1007],["Mia",null]],"affected":0}]},"full|-- Customers who share a full name with someone else\nSELECT a.id, b.id AS same_name_id, a.first_name, a.last_name\nFROM customers a\nJOIN customers b\n  ON b.first_name = a.first_name\n AND b.last_name = a.last_name\n AND b.id > a.id;":{"ok":true,"results":[{"fields":["id","same_name_id","first_name","last_name"],"rows":[[2,61,"John","Smith"]],"affected":0}]},"small|-- No join condition: 5 x 6 = 30 rows\nSELECT c.first_name, o.id\nFROM customers c, orders o;":{"ok":true,"results":[{"fields":["first_name","id"],"rows":[["Emma",1001],["John",1001],["Olivia",1001],["James",1001],["Mia",1001],["Emma",1002],["John",1002],["Olivia",1002],["James",1002],["Mia",1002],["Emma",1003],["John",1003],["Olivia",1003],["James",1003],["Mia",1003],["Emma",1007],["John",1007],["Olivia",1007],["James",1007],["Mia",1007],["Emma",1026],["John",1026],["Olivia",1026],["James",1026],["Mia",1026],["Emma",1098],["John",1098],["Olivia",1098],["James",1098],["Mia",1098]],"affected":0}]},"small|-- One query for every customer's orders, instead of one per customer\nSELECT customer_id, id AS order_id, status\nFROM orders\nWHERE customer_id = ANY('{1, 2, 3, 4, 5}'::bigint[])\nORDER BY customer_id, id;":{"ok":true,"results":[{"fields":["customer_id","order_id","status"],"rows":[[1,1001,"delivered"],[1,1026,"delivered"],[1,1098,"delivered"],[2,1002,"delivered"],[3,1003,"delivered"],[4,1007,"delivered"]],"affected":0}]},"small|SELECT c.id, c.first_name,\n       COALESCE(json_agg(json_build_object('id', o.id, 'status', o.status)\n                ORDER BY o.id) FILTER (WHERE o.id IS NOT NULL),\n                '[]') AS orders\nFROM customers c\nLEFT JOIN orders o ON o.customer_id = c.id\nGROUP BY c.id\nORDER BY c.id;":{"ok":true,"results":[{"fields":["id","first_name","orders"],"rows":[[1,"Emma",[{"id":1001,"status":"delivered"},{"id":1026,"status":"delivered"},{"id":1098,"status":"delivered"}]],[2,"John",[{"id":1002,"status":"delivered"}]],[3,"Olivia",[{"id":1003,"status":"delivered"}]],[4,"James",[{"id":1007,"status":"delivered"}]],[5,"Mia",[]]],"affected":0}]},"small|-- Blocked: Emma still has orders\nDELETE FROM customers\nWHERE id = 1;":{"ok":false,"error":{"message":"update or delete on table \"customers\" violates foreign key constraint \"orders_customer_id_fkey\" on table \"orders\"","detail":"Key (id)=(1) is still referenced from table \"orders\".","hint":""},"rolledBack":false},"small|UPDATE customers\nSET first_name = 'Deleted',\n    last_name  = 'User',\n    email      = 'deleted-' || id || '@example.invalid'\nWHERE id = 1;":{"ok":true,"results":[{"fields":[],"rows":[],"affected":1}]},"small|INSERT INTO orders (customer_id)\nVALUES (NULL);":{"ok":false,"error":{"message":"null value in column \"customer_id\" of relation \"orders\" violates not-null constraint","detail":"Failing row contains (1121, null, processing, 2026-10-21).","hint":""},"rolledBack":false},"small|-- Our schema adds them on purpose, for example:\n-- CREATE INDEX ON orders (customer_id);\nSELECT tablename, indexname, indexdef\nFROM pg_indexes\nWHERE schemaname = 'public'\nORDER BY tablename, indexname;":{"ok":true,"results":[{"fields":["tablename","indexname","indexdef"],"rows":[["customers","customers_email_key","CREATE UNIQUE INDEX customers_email_key ON public.customers USING btree (email)"],["customers","customers_pkey","CREATE UNIQUE INDEX customers_pkey ON public.customers USING btree (id)"],["customers","customers_referred_by_idx","CREATE INDEX customers_referred_by_idx ON public.customers USING btree (referred_by)"],["loyalty_cards","loyalty_cards_card_number_key","CREATE UNIQUE INDEX loyalty_cards_card_number_key ON public.loyalty_cards USING btree (card_number)"],["loyalty_cards","loyalty_cards_customer_id_key","CREATE UNIQUE INDEX loyalty_cards_customer_id_key ON public.loyalty_cards USING btree (customer_id)"],["loyalty_cards","loyalty_cards_pkey","CREATE UNIQUE INDEX loyalty_cards_pkey ON public.loyalty_cards USING btree (id)"],["order_items","order_items_pkey","CREATE UNIQUE INDEX order_items_pkey ON public.order_items USING btree (order_id, product_id)"],["order_items","order_items_product_id_idx","CREATE INDEX order_items_product_id_idx ON public.order_items USING btree (product_id)"],["orders","orders_customer_id_idx","CREATE INDEX orders_customer_id_idx ON public.orders USING btree (customer_id)"],["orders","orders_pkey","CREATE UNIQUE INDEX orders_pkey ON public.orders USING btree (id)"],["products","products_pkey","CREATE UNIQUE INDEX products_pkey ON public.products USING btree (id)"]],"affected":0}]},"small|INSERT INTO customers (id, first_name, last_name, email)\nVALUES (500, 'Leo', 'Hart', 'leo.hart@example.com');":{"ok":false,"error":{"message":"cannot insert a non-DEFAULT value into column \"id\"","detail":"Column \"id\" is an identity column defined as GENERATED ALWAYS.","hint":"Use OVERRIDING SYSTEM VALUE to override."},"rolledBack":false},"small|SELECT gen_random_uuid() AS v4,\n       uuidv7()          AS v7;":{"ok":true,"results":[{"fields":["v4","v7"],"rows":[["0d5e0218-f7ff-40b5-8372-2cc02fb9023a","01a15d91-fb2c-7000-9a10-5b514cc65aba"]],"affected":0}]},"small|SELECT DISTINCT ON (c.id)\n       c.first_name, o.id AS order_id, o.placed_on\nFROM customers c\nJOIN orders o ON o.customer_id = c.id\nORDER BY c.id, o.placed_on DESC;":{"ok":true,"results":[{"fields":["first_name","order_id","placed_on"],"rows":[["Emma",1098,"2026-08-24"],["John",1002,"2025-11-07"],["Olivia",1003,"2025-11-12"],["James",1007,"2025-11-28"]],"affected":0}]},"small|CREATE TABLE users (\n  id    bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n  email text   NOT NULL UNIQUE\n);\nCREATE TABLE posts (\n  id        bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n  author_id bigint NOT NULL REFERENCES users (id),\n  title     text   NOT NULL\n);\nCREATE TABLE comments (\n  id        bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n  post_id   bigint NOT NULL REFERENCES posts (id) ON DELETE CASCADE,\n  author_id bigint NOT NULL REFERENCES users (id),\n  body      text   NOT NULL\n);\nCREATE TABLE tags (\n  id   bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n  name text   NOT NULL UNIQUE\n);\nCREATE TABLE post_tags (\n  post_id bigint NOT NULL REFERENCES posts (id) ON DELETE CASCADE,\n  tag_id  bigint NOT NULL REFERENCES tags (id),\n  PRIMARY KEY (post_id, tag_id)\n);":{"ok":true,"results":[{"fields":[],"rows":[],"affected":0},{"fields":[],"rows":[],"affected":0},{"fields":[],"rows":[],"affected":0},{"fields":[],"rows":[],"affected":0},{"fields":[],"rows":[],"affected":0}]},"small|CREATE TABLE authors (\n  id   bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n  name text   NOT NULL\n);\nCREATE TABLE books (\n  id    bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n  title text   NOT NULL\n);\nCREATE TABLE book_authors (\n  book_id   bigint NOT NULL REFERENCES books (id),\n  author_id bigint NOT NULL REFERENCES authors (id),\n  PRIMARY KEY (book_id, author_id)\n);\nCREATE TABLE members (\n  id    bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n  email text   NOT NULL UNIQUE\n);\nCREATE TABLE loans (\n  id          bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n  book_id     bigint NOT NULL REFERENCES books (id),\n  member_id   bigint NOT NULL REFERENCES members (id),\n  loaned_on   date   NOT NULL DEFAULT current_date,\n  returned_on date\n);\n-- A book can only be out once at a time\nCREATE UNIQUE INDEX one_open_loan_per_book\n  ON loans (book_id) WHERE returned_on IS NULL;":{"ok":true,"results":[{"fields":[],"rows":[],"affected":0},{"fields":[],"rows":[],"affected":0},{"fields":[],"rows":[],"affected":0},{"fields":[],"rows":[],"affected":0},{"fields":[],"rows":[],"affected":0},{"fields":[],"rows":[],"affected":0}]},"small|SELECT c.id, c.first_name\nFROM customers c\nWHERE NOT EXISTS (\n  SELECT 1 FROM orders o WHERE o.customer_id = c.id\n)\nORDER BY c.id;":{"ok":true,"results":[{"fields":["id","first_name"],"rows":[[5,"Mia"]],"affected":0}]},"small|SELECT c.first_name,\n       COALESCE(sum(oi.quantity * oi.unit_price), 0) AS spent\nFROM customers c\nLEFT JOIN orders o       ON o.customer_id = c.id\nLEFT JOIN order_items oi ON oi.order_id = o.id\nGROUP BY c.id\nORDER BY spent DESC, c.id;":{"ok":true,"results":[{"fields":["first_name","spent"],"rows":[["Emma","263.96"],["James","89.98"],["John","79.98"],["Olivia","34.99"],["Mia","0"]],"affected":0}]},"small|SELECT c.id, c.first_name\nFROM customers c\nJOIN orders o       ON o.customer_id = c.id\nJOIN order_items oi ON oi.order_id = o.id\nWHERE oi.product_id IN (2, 5)\nGROUP BY c.id\nHAVING count(DISTINCT oi.product_id) = 2\nORDER BY c.id;":{"ok":true,"results":[{"fields":["id","first_name"],"rows":[[1,"Emma"],[4,"James"]],"affected":0}]},"small|SELECT order_id, count(*) AS products\nFROM order_items\nGROUP BY order_id\nHAVING count(*) > 1\nORDER BY order_id;":{"ok":true,"results":[{"fields":["order_id","products"],"rows":[[1001,2],[1002,2],[1007,2],[1098,2]],"affected":0}]},"full|SELECT p.id, p.name\nFROM products p\nWHERE NOT EXISTS (\n  SELECT 1 FROM order_items oi WHERE oi.product_id = p.id\n)\nORDER BY p.id;":{"ok":true,"results":[{"fields":["id","name"],"rows":[[21,"24\" Full HD Monitor"],[43,"RGB Light Strip (6.5 ft)"],[57,"Wireless Charging Pad"],[66,"External Hard Drive 4 TB"],[67,"microSD Card 256 GB"],[72,"Adjustable Footrest"],[75,"Anti-Fatigue Mat"],[81,"Tech Organizer Pouch"],[82,"Laptop Backpack (25 L)"],[84,"Keyboard Carry Case"],[86,"Blue Light Glasses"],[89,"Aluminum Tablet Stand"],[92,"USB Desk Fan"],[93,"Wireless Presenter Remote"],[95,"Stream Controller (15 Keys)"],[97,"Acoustic Foam Panels (12-Pack)"],[98,"Wireless Gaming Headset"],[100,"Faux Succulent Desk Set"]],"affected":0}]},"full|SELECT first_name, last_name, array_agg(id ORDER BY id) AS ids\nFROM customers\nGROUP BY first_name, last_name\nHAVING count(*) > 1;":{"ok":true,"results":[{"fields":["first_name","last_name","ids"],"rows":[["John","Smith",[2,61]]],"affected":0}]}};</script>
<script>window.TABS_PAGE = 'playground';</script>
<script>
/* The three pages (story, playground, game) each live in their own named tab.
   Hold Space and press P, G or S to jump between them. Tabs talk over a
   BroadcastChannel, so a page can hand another page a command (like a query
   to load) or ask it to come to the front. */
(function () {
  'use strict';
  var PAGE = window.TABS_PAGE;
  var PAGES = {
    story: { file: 'db-relations-story.html', name: 'dbrel-story', label: 'Story' },
    playground: { file: 'db-relations-playground.html', name: 'dbrel-playground', label: 'Playground' },
    game: { file: 'db-relations-game.html', name: 'dbrel-game', label: 'Game' }
  };
  var KEYS = { p: 'playground', g: 'game', s: 'story' };
  var ALIVE_MS = 90000;
  /* a fixed tab name, so window.open can find this tab again instead of opening a copy */
  try { window.name = PAGES[PAGE].name; } catch (e) { /* ignore */ }

  /* ---------- messages between tabs ---------- */
  var me = Math.random().toString(36).slice(2);
  var seq = 0;
  var seen = {};
  var handlers = [];
  var cmdHandlers = [];
  var pendingCmds = [];
  var alive = {};
  var ch = null;
  try { ch = new BroadcastChannel('dbrel-tabs'); } catch (e) { ch = null; }

  function send(msg, win) {
    seq += 1;
    var m = { id: me + ':' + seq, from: me, page: PAGE };
    for (var k in msg) m[k] = msg[k];
    if (ch) { try { ch.postMessage(m); } catch (e) { /* closed */ } }
    if (win) { try { win.postMessage({ __dbrelTabs: m }, '*'); } catch (e) { /* closed */ } }
  }
  function runCmd(cmd) {
    if (!cmdHandlers.length) { pendingCmds.push(cmd); return; }
    cmdHandlers.forEach(function (h) { try { h(cmd); } catch (e) { console.error(e); } });
  }
  function receive(m) {
    if (!m || m.from === me || seen[m.id]) return;
    seen[m.id] = 1;
    if (m.type === 'bye') delete alive[m.page];
    else if (m.page) alive[m.page] = Date.now();
    if (m.type === 'hello') send({ type: 'here' });
    if (m.to && m.to !== PAGE) return;
    if (m.type === 'focus') { try { window.focus(); } catch (e) { /* ignore */ } }
    if (m.type === 'cmd' && m.cmd) runCmd(m.cmd);
    handlers.forEach(function (h) { try { h(m); } catch (e) { console.error(e); } });
  }
  if (ch) ch.onmessage = function (e) { receive(e.data); };
  window.addEventListener('message', function (e) { if (e.data && e.data.__dbrelTabs) receive(e.data.__dbrelTabs); });
  send({ type: 'hello' });
  setInterval(function () { send({ type: 'here' }); }, 20000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) send({ type: 'here' }); });
  window.addEventListener('pagehide', function () { send({ type: 'bye' }); });

  /* a command can also arrive in the address, when this tab was just opened for it */
  (function () {
    var m = /^#cmd=(.*)$/.exec(location.hash || '');
    if (!m) return;
    try { pendingCmds.push(JSON.parse(decodeURIComponent(m[1]))); } catch (e) { /* bad link */ }
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* file urls */ }
  })();

  /* ---------- a small note in the corner ---------- */
  var noteTimer = null;
  function note(text) {
    var el = document.getElementById('tabsNote');
    if (!el) {
      el = document.createElement('div');
      el.id = 'tabsNote';
      el.setAttribute('role', 'status');
      el.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:9999;padding:10px 18px;border-radius:12px;' +
        'font:600 17px/1.3 system-ui,sans-serif;background:rgba(20,22,30,.94);color:#fff;box-shadow:0 10px 30px -10px rgba(0,0,0,.6);pointer-events:none';
      document.body.appendChild(el);
    }
    el.textContent = text;
    el.hidden = false;
    clearTimeout(noteTimer);
    noteTimer = setTimeout(function () { el.hidden = true; }, 2800);
  }

  /* ---------- open a page, or bring its tab to the front ---------- */
  function go(page, cmd) {
    var P = PAGES[page];
    if (!P) return;
    if (page === PAGE) { if (cmd) runCmd(cmd); return; }
    var w = null;
    try { w = window.open('', P.name); } catch (e) { w = null; }
    if (!w) { note('Allow pop-ups for this file, then try again.'); return; }
    var fresh = false;
    try { fresh = w.location.href === 'about:blank'; } catch (e) { fresh = false; }
    if (!fresh) {
      /* the tab is already there: bring it forward and hand it the command */
      try { w.focus(); } catch (e) { /* ignore */ }
      if (cmd) send({ type: 'cmd', to: page, cmd: cmd }, w);
      return;
    }
    var url = new URL(P.file, location.href).href + (cmd ? '#cmd=' + encodeURIComponent(JSON.stringify(cmd)) : '');
    var load = function () { try { w.location.replace(url); w.focus(); } catch (e) { /* ignore */ } };
    var last = alive[page];
    if (!last || Date.now() - last > ALIVE_MS) { load(); return; }
    /* it may be open in a tab this one can't reach by name: check before making a second copy */
    var answered = false;
    var listen = function (m) { if (m.type === 'here' && m.page === page) answered = true; };
    handlers.push(listen);
    send({ type: 'hello' });
    setTimeout(function () {
      handlers.splice(handlers.indexOf(listen), 1);
      if (!answered) { load(); return; }
      try { w.close(); } catch (e) { /* ignore */ }
      send({ type: 'focus', to: page });
      if (cmd) send({ type: 'cmd', to: page, cmd: cmd });
      note(P.label + ' is already open in another tab.');
    }, 160);
  }

  /* ---------- Space + P / G / S ---------- */
  var TEXT_INPUT = /^(text|search|email|url|tel|password|number|date|datetime-local|month|time|week)$/i;
  function typing(t) {
    if (!t || !t.closest) return false;
    if (t.closest('textarea, select, [contenteditable=""], [contenteditable="true"]')) return true;
    return t.tagName === 'INPUT' && TEXT_INPUT.test(t.type || 'text');
  }
  var shortcut = function (page) { go(page); };
  var held = false;
  var used = false;
  var heldTarget = null;
  var heldShift = false;
  var replaying = false;
  window.addEventListener('keydown', function (e) {
    if (replaying || e.ctrlKey || e.metaKey || e.altKey || typing(e.target)) return;
    if (e.key === ' ' || e.code === 'Space') {
      /* Space waits for its key-up: alone it does its usual job, with P, G or S it switches tabs */
      e.preventDefault();
      e.stopImmediatePropagation();
      if (e.repeat || held) return;
      held = true; used = false; heldTarget = e.target; heldShift = e.shiftKey;
      return;
    }
    if (!held) return;
    var page = KEYS[(e.key || '').toLowerCase()];
    if (!page) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    used = true;
    if (page === PAGE) { note("You're on the " + PAGES[page].label + '.'); return; }
    shortcut(page);
  }, true);
  window.addEventListener('keyup', function (e) {
    if (e.key !== ' ' && e.code !== 'Space') return;
    if (!held) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    held = false;
    if (!used) replay(heldTarget, heldShift);
  }, true);
  window.addEventListener('blur', function () { held = false; });
  /* hand the plain Space press back to the page, exactly as it would have arrived */
  function replay(t, shift) {
    var target = t && t.isConnected ? t : document.body;
    var ev = new KeyboardEvent('keydown', { key: ' ', code: 'Space', shiftKey: shift, bubbles: true, cancelable: true });
    var open;
    replaying = true;
    try { open = target.dispatchEvent(ev); } finally { replaying = false; }
    if (open && target.matches && target.matches('button, [role="button"], summary, input[type="checkbox"], input[type="radio"]') && !target.disabled) target.click();
  }

  /* links between the pages (the tabs in the header) */
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[data-page]');
    if (!a || e.ctrlKey || e.metaKey || e.shiftKey || e.button) return;
    e.preventDefault();
    if (a.dataset.page !== PAGE) shortcut(a.dataset.page);
  });

  window.Tabs = {
    page: PAGE,
    go: go,
    send: send,
    note: note,
    on: function (h) { handlers.push(h); },
    onCommand: function (h) {
      cmdHandlers.push(h);
      var list = pendingCmds.splice(0);
      if (list.length) setTimeout(function () { list.forEach(runCmd); }, 0);
    },
    setShortcut: function (fn) { shortcut = fn; }
  };
})();

</script>
<script>
(function () {
  function start() {
    Tabs.on(function (m) { if (m.type === 'theme' && m.t && m.t !== document.documentElement.dataset.theme) UI.setTheme(m.t); });
    Tabs.onCommand(function (c) {
      if (c.type === 'mode') PG.setMode(c.mode);
      else if (c.type === 'write') {
        PG.setMode('write');
        if (PG.WS.dataset !== 'small') PG.switchData('small');
        PG.setEditor(c.sql);
        var bar = document.querySelector('#mode-write .runbar');
        var tag = document.getElementById('pageLesson');
        if (!tag && bar) { tag = document.createElement('span'); tag.id = 'pageLesson'; tag.className = 'pill page-lesson'; bar.appendChild(tag); }
        if (tag) { tag.textContent = c.label || ''; tag.hidden = !c.label; }
        setTimeout(function () { var ta = document.getElementById('wzText'); if (ta) ta.focus({ preventScroll: true }); }, 120);
      }
    });
    /* start PostgreSQL in the background, so the first Run is quick */
    setTimeout(function () { PG.ensurePG(); }, 1000);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>
</body>
</html>
